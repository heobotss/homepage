<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>자료 내려받기 — 허봇스</title>
<link rel="icon" href="/favicon.png" type="image/png">
<style>
/* 허봇스 자료 내려받기 (2026-10-02) — 무료 열림(0원 열람권)으로 열린 PDF 한 개를 받는 곳.
   메일의 「지금 열기」를 누르면 로그인된 채로 여기에 온다. 주소 /dl/?k=<vod_files.key>
   열람권 확인·이메일 도장·하루 40회 제한은 서버 함수 vod-file 이 한다. 이 페이지는 버튼만 있다. */
@font-face{font-family:'Pretend';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/pretendard-400.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/pretendard-700.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-style:normal;font-weight:900;font-display:swap;src:url('/fonts/pretendard-900.woff2') format('woff2')}
@font-face{font-family:'Bahn';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/bahn-700.woff2') format('woff2')}
:root{color-scheme:dark;--ink:#0A0A0A;--ink-2:#111111;--bone:#F2F2F2;--bone-2:#BDBDBD;--warm:#8E8E8E;--line:#222222;--line-2:#2F2F2F;--blue:#4F86F7;--sage:#4F86F7;--bad:#E07A6B;
--sans:"Pretend","Pretendard","Apple SD Gothic Neo",-apple-system,system-ui,sans-serif;--tech:"Bahn","Bahnschrift",var(--sans)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans);font-size:1rem;line-height:1.8;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;flex-direction:column}
a{color:var(--bone)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(16px,4vw,40px);border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:1.25rem;letter-spacing:-.02em;text-decoration:none}
.logo small{font-family:var(--tech);font-size:.6875rem;color:var(--blue);letter-spacing:.12em;margin-left:6px;vertical-align:2px}
.top .home{font-size:.8125rem;color:var(--warm);text-decoration:none}
main{flex:1;width:100%;max-width:620px;margin:0 auto;padding:clamp(48px,10vw,96px) clamp(16px,4vw,28px) 48px}
.eyebrow{font-family:var(--tech);font-size:.75rem;letter-spacing:.14em;color:var(--blue)}
h1{font-size:clamp(1.8rem,6.4vw,2.6rem);line-height:1.24;letter-spacing:-.045em;font-weight:900;margin:12px 0 0}
.lede{color:var(--bone-2);margin:16px 0 0}
.facts{list-style:none;margin:32px 0 0;padding:0;border-top:1px solid var(--line)}
.facts li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.9375rem;color:var(--bone-2)}
.facts b{color:var(--bone);font-weight:700;text-align:right}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:15px 26px;font-size:1rem;font-weight:700;cursor:pointer;background:#F2F2F2;color:#0A0A0A;text-decoration:none;width:100%;margin-top:28px}
.btn:hover{background:#FFF}
.btn:disabled{opacity:.5;cursor:default}
.btn.line{background:transparent;color:var(--bone);border:1px solid var(--line-2);margin-top:10px}
.msg{margin:12px 0 0;font-size:.9375rem;color:var(--bad);min-height:1.5em}
.note{font-size:.8125rem;color:var(--warm);line-height:1.7}
.next{margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.next b{display:block;font-size:1.05rem}
.next a{display:block;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--bone-2);font-size:.9375rem}
.next a:hover{color:var(--bone)}
/* 로그인 상자(auth.js 가 그린다) */
.card.auth{margin-top:28px;padding:22px;border:1px solid var(--line-2);border-radius:14px;background:var(--ink-2)}
.card.auth h2{margin:0 0 8px;font-size:1.2rem}
.card.auth label{display:block;font-size:.875rem;color:var(--bone-2);margin:12px 0 6px}
.card.auth input{width:100%;background:var(--ink);border:1px solid var(--line-2);border-radius:10px;color:var(--bone);font:inherit;padding:12px 14px;outline:none}
.card.auth input:focus{border-color:var(--blue)}
.card.auth .btn{margin-top:16px}
.card.auth .note a{color:var(--bone-2)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="../vod/auth.js"></script>
</head>
<body>
<header class="top">
  <a class="logo" href="/">허봇스<small>HEOBOTSS</small></a>
  <a class="home" href="/lesson/">레슨 보기</a>
</header>
<main>
  <p class="eyebrow">DOWNLOAD</p>
  <h1 id="title">자료 내려받기</h1>
  <p class="lede" id="lede">잠시만요, 확인하고 있습니다.</p>

  <div id="box" hidden>
    <ul class="facts">
      <li><span>파일</span><b id="fname">PDF</b></li>
      <li><span>받을 수 있는 기간</span><b>열람권을 받은 때부터 7일</b></li>
      <li><span>표시</span><b>페이지마다 내 메일 주소가 찍힙니다</b></li>
    </ul>
    <button class="btn" id="go" type="button">PDF 내려받기</button>
    <p class="msg" id="msg" role="alert"></p>
    <p class="note">본인이 보려고 받는 자료입니다. 다른 분께는 파일 대신 이 신청 페이지 주소를 보내 주세요.</p>
    <div class="next" id="next">
      <b>같이 보면 좋은 레슨</b>
      <a href="/score/">트레이너 점수 체크리스트 30문항 미리 보기</a>
    </div>
  </div>

  <div id="auth"></div>
</main>
<script src="/t.js"></script>
<script>
(function(){
  "use strict";
  var sb = HB.sb, FN = HB.SB_URL + "/functions/v1/";
  var key = new URLSearchParams(location.search).get("k") || "";
  var $ = function(id){ return document.getElementById(id); };

  async function boot(){
    if (!/^[\w\-\/\.]{3,120}$/.test(key)) { $("lede").textContent = "주소가 올바르지 않습니다. 메일의 「지금 열기」 버튼으로 다시 들어와 주세요."; return; }
    var f = await sb.from("vod_files").select("title").eq("key", key).maybeSingle();
    if (!f.data) { $("lede").textContent = "파일을 찾을 수 없습니다. 메일의 버튼으로 다시 들어와 주세요."; return; }
    $("title").textContent = f.data.title; $("fname").textContent = f.data.title + ".pdf";
    /* 자료마다 이어 볼 레슨 — 새 무료 열림을 넣을 때 여기 한 줄 */
    var NEXT = {
      "free/mock-vol1.pdf":   [["/lesson/8/", "레슨 8 · 하부 승모근 운동을 틀리는 헬스트레이너, 회원 어깨가 그대로인 이유"], ["/lesson/12/", "레슨 12 · 「요즘 운동 오기 싫어요」에 세트부터 늘리는 헬스트레이너"]],
      "free/ebook-rereg.pdf": [["/lesson/2/", "레슨 2 · 「수고하셨습니다」로 수업을 끝내는 헬스트레이너가 서른 번 뒤에 듣는 말"], ["/lesson/6/", "레슨 6 · 종이 일지로 재등록 타이밍을 놓치는 헬스트레이너, 월요일 아침 5분"]],
      "free/ebook-schedule.pdf": [["/lesson/9/", "레슨 9 · 수업 알림을 전날 보내는 헬스트레이너, 당일 알림 한 통"], ["/lesson/10/", "레슨 10 · 노쇼·당일 취소로 수업이 비는 헬스트레이너, 스케줄 순서"]]
    };
    var nx = $("next"), first = nx.querySelector("a");
    (NEXT[key] || []).forEach(function(x){ var a = document.createElement("a"); a.href = x[0]; a.textContent = x[1]; nx.insertBefore(a, first); });
    document.title = f.data.title + " 내려받기 — 허봇스";
    var s = (await sb.auth.getSession()).data.session;
    if (!s) {
      $("lede").textContent = "메일의 「지금 열기」 버튼으로 들어오면 로그인된 채로 열립니다. 버튼 시간이 지났다면 아래에서 로그인해 주세요.";
      HB.mountAuth($("auth"), function(){ $("auth").innerHTML = ""; boot(); }, { lead: "무료 열람권을 신청한 메일 주소로 로그인하세요. 비밀번호를 정한 적이 없다면 「비밀번호를 잊었어요」로 새로 정하면 됩니다." });
      return;
    }
    $("lede").textContent = s.user.email + " 계정으로 열려 있습니다.";
    $("box").hidden = false;
  }

  $("go").onclick = async function(){
    var b = $("go"), t = b.textContent; b.disabled = true; b.textContent = "만드는 중…"; $("msg").textContent = "";
    try {
      var s = (await sb.auth.getSession()).data.session;
      var r = await fetch(FN + "vod-file", { method: "POST", headers: { "Content-Type": "application/json", apikey: HB.SB_KEY, Authorization: "Bearer " + (s ? s.access_token : HB.SB_KEY) }, body: JSON.stringify({ key: key }) });
      if (!r.ok) { var e = await r.json().catch(function(){ return {}; }); throw new Error(e.message || "내려받지 못했습니다"); }
      var blob = await r.blob(), cd = r.headers.get("Content-Disposition") || "";
      var m = cd.match(/filename\*=UTF-8''([^;]+)/), name = m ? decodeURIComponent(m[1]) : "허봇스 자료.pdf";
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      b.textContent = "다시 받기"; b.disabled = false; return;
    } catch (e) { $("msg").textContent = e.message; }
    b.disabled = false; b.textContent = t;
  };

  sb.auth.onAuthStateChange(function(ev){ if (ev === "SIGNED_IN") { history.replaceState(null, "", location.pathname + location.search); } });
  boot();
})();
</script>
</body>
</html>
