<html lang="ko">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 프로그램 — 허봇스</title>

<style>
/* 내 프로그램 (2026-11-03) — 대기 줄에 넣으면 PC 일꾼이 처리한다. 토큰은 me/index.html 과 같다. */
@font-face{font-family:'Pretend';font-style:normal;font-weight:400;font-display:swap;src:url('../../fonts/pretendard-400.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-style:normal;font-weight:700;font-display:swap;src:url('../../fonts/pretendard-700.woff2') format('woff2')}
:root{color-scheme:dark;--ink:#0A0A0A;--ink-2:#111111;--ink-3:#171717;--bone:#F2F2F2;--bone-2:#BDBDBD;--warm:#8E8E8E;--line:#333333;--blue:#4F86F7;--good:#5FBF8A;--bad:#E07A6B;--warn:#E0B44F;
  --sans:"Pretend","Pretendard","Apple SD Gothic Neo",-apple-system,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans);line-height:1.7;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:var(--bone)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
[hidden]{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(16px,4vw,40px);border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:1.25rem;text-decoration:none}
.top a.me{color:var(--warm);font-size:.9375rem;text-decoration:none}
main{max-width:760px;margin:0 auto;padding:clamp(24px,5vw,44px) clamp(16px,4vw,24px) 80px}
h1{font-size:clamp(1.5rem,5vw,2rem);line-height:1.3;letter-spacing:-.03em;margin:0 0 8px}
h2{font-size:1.25rem;margin:0 0 6px}
h3{font-size:1rem;margin:22px 0 8px}
.lead{color:var(--bone-2);margin:0 0 22px}
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,4vw,24px);margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.tool{display:block;text-decoration:none;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:16px;min-height:112px}
.tool b{display:block;margin-bottom:4px}
.tool span{color:var(--warm);font-size:.875rem;line-height:1.55;display:block}
.tool:hover{border-color:var(--warm)}
.tool.off{opacity:.45}
.tier{color:var(--blue);font-size:.8125rem;margin:26px 0 10px}
label{display:block;margin:14px 0 6px;font-size:.9375rem}
small.why{display:block;color:var(--warm);margin:-2px 0 6px}
input,textarea,select{width:100%;background:var(--ink-3);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
button.go{margin-top:16px;background:var(--bone);color:#0A0A0A;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer}
button.go:disabled{opacity:.5;cursor:default}
button.sub{margin-top:16px;background:none;border:1px solid var(--line);border-radius:8px;padding:11px 16px;cursor:pointer}
.msg{margin-top:12px;color:var(--bad);font-size:.9375rem}
.msg.ok{color:var(--good)}
.answer{font-size:clamp(1.5rem,5vw,2rem);font-weight:700;margin:4px 0}
.answer.도전{color:var(--good)}.answer.아직{color:var(--bad)}.answer.빠듯{color:var(--warn)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9375rem;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;white-space:nowrap}
th{color:var(--warm);font-weight:400}
ul.fix{margin:10px 0;padding-left:20px}ul.fix li{margin-bottom:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
.빨강{background:var(--bad)}.노랑{background:var(--warn)}.초록{background:var(--good)}
.note{color:var(--warm);font-size:.8125rem;margin-top:12px}
.back{display:inline-block;margin-bottom:14px;color:var(--warm);text-decoration:none;font-size:.9375rem}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.cards img{width:100%;border-radius:8px;display:block}
.md{font-size:.9375rem}.md h1{font-size:1.125rem;margin:18px 0 6px}.md h2{font-size:1rem;margin:16px 0 6px}.md blockquote{margin:6px 0;color:var(--warm);font-size:.8125rem}
/* ── 새 옷 공통 (11-10) ── 옛 화면의 첫 스타일 끝에 덧붙는다. 색 토큰을 새 값으로 다시 선언하고 배경 빛·버튼·판만 바꾼다. 글자·id·스크립트는 그대로 */
:root{color-scheme:dark;--ink:#0A0A0B;--ink-2:#141416;--ink-3:#1A1A1D;--bone:#F2F0EB;--bone-2:#C9C7C2;--warm:#A3A39E;--line:#242426;--line-2:rgba(242,240,235,.16);--blue:#4F86F7;--brass:#4F86F7;--bad:#E07A6B}
html{background:#0A0A0B}
body{background:radial-gradient(900px 520px at 50% -120px,rgba(79,134,247,.20),transparent 70%) no-repeat,radial-gradient(600px 400px at 100% 30%,rgba(79,134,247,.07),transparent 70%) no-repeat,var(--ink)}
::selection{background:rgba(79,134,247,.35)}
.btn{border-radius:999px;background:var(--blue);color:#0A0A0B;box-shadow:0 8px 28px rgba(79,134,247,.32),inset 0 1px 0 rgba(255,255,255,.28);transition:background .2s,transform .2s,box-shadow .2s}
.btn:hover{background:#6B9CFF;transform:translateY(-1px)}
.btn[disabled],.btn:disabled{opacity:.38;transform:none;box-shadow:none;cursor:default}
.btn.line,.btn.sub,.btn.soon{background:transparent;color:var(--bone);border:1px solid var(--line-2);box-shadow:none}
.btn.line:hover,.btn.sub:hover{background:rgba(242,240,235,.05);border-color:rgba(242,240,235,.36)}
.card{border:1px solid var(--line-2);border-radius:20px;background:rgba(242,240,235,.03);box-shadow:inset 0 1px 0 rgba(242,240,235,.06),0 24px 64px rgba(0,0,0,.35)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=password],input[type=search],input[type=url],select,textarea{border-radius:14px}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(79,134,247,.16);outline:0}
@media (prefers-reduced-motion:reduce){.btn,.btn:hover{transform:none}}
/* 11-10 체크박스 한 벌 — 새 화면과 같은 꼴(얇은 테두리, 고르면 파랑) */
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:20px;height:20px;flex:0 0 20px;margin-top:2px;border:1.5px solid rgba(242,240,235,.38);border-radius:6px;background:transparent;display:inline-grid;place-content:center;cursor:pointer;transition:background-color .15s,border-color .15s}
input[type=checkbox]::before{content:"";width:10px;height:5px;border-left:2px solid #0A0A0B;border-bottom:2px solid #0A0A0B;transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .15s}
input[type=checkbox]:checked{background:var(--blue);border-color:var(--blue)}
input[type=checkbox]:checked::before{transform:translateY(-1px) rotate(-45deg) scale(1)}
input[type=checkbox]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input[type=checkbox]:disabled{opacity:.4;cursor:default}
/* 내 도구 묶음 — 팀 숫자 화면의 옛 한 줄 꼬리(「허봇스」)는 아래 사업자 정보와 겹쳐 숨긴다 */
footer:not(.hb-legal){display:none}
</style>
