<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 프로필 — 허봇스</title>
<meta name="description" content="허봇스 멤버십·성적표에 쓰이는 내 정보를 한 번만 채워 둡니다.">
<meta name="robots" content="noindex,follow">
<link rel="icon" href="../favicon.png" type="image/png">
<style>
/* 내 프로필 — 가입은 이메일·비밀번호만 받고, 나머지 네 칸은 여기서 한 번 채운다 (2026-10-01)
   메인 홈페이지 무채색 토큰 그대로. 블루는 작은 라벨·강조선에만. */
@font-face{font-family:'Pretend';font-style:normal;font-weight:400;font-display:swap;src:url('../fonts/pretendard-400.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-style:normal;font-weight:700;font-display:swap;src:url('../fonts/pretendard-700.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-style:normal;font-weight:900;font-display:swap;src:url('../fonts/pretendard-900.woff2') format('woff2')}
:root{color-scheme:dark;--ink:#0A0A0A;--ink-2:#111111;--ink-3:#171717;--bone:#F2F2F2;--bone-2:#BDBDBD;--warm:#8E8E8E;
  --line:#333333;--line-2:#3C3C3C;--blue:#4F86F7;--good:#5FBF8A;--bad:#E07A6B;
  --sans:"Pretend","Pretendard","Apple SD Gothic Neo",-apple-system,system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans);font-size:1rem;line-height:1.8;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:var(--bone)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
[hidden]{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(16px,4vw,40px);border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:1.25rem;letter-spacing:-.02em;color:var(--bone);text-decoration:none}
.logo small{font-family:"Bahnschrift",var(--sans);font-size:.6875rem;color:var(--blue);letter-spacing:.12em;margin-left:6px;vertical-align:2px}
.top nav{display:flex;gap:14px;font-size:.9375rem;color:var(--warm)}
.top nav a{color:var(--warm);text-decoration:none}
main{max-width:620px;margin:0 auto;padding:clamp(28px,6vw,48px) clamp(16px,4vw,24px) 80px}
h1{font-size:clamp(1.5rem,5vw,2rem);line-height:1.3;letter-spacing:-.03em;margin:0 0 10px}
.lead{color:var(--bone-2);margin:0 0 26px}
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,24px)}
label{display:block;margin-top:18px;font-size:.9375rem}
label:first-of-type{margin-top:0}
label .k{display:block;margin-bottom:6px}
label .why{display:block;color:var(--warm);font-size:.8125rem;line-height:1.6;margin-bottom:8px}
input[type=text],input[type=email],input[type=tel]{width:100%;background:var(--ink-3);border:1px solid var(--line-2);border-radius:10px;
  color:var(--bone);font:inherit;padding:12px 14px;min-height:48px}
input:disabled{color:var(--warm)}
.pre{display:flex;align-items:center;gap:0}
.pre span{background:var(--ink-3);border:1px solid var(--line-2);border-right:0;border-radius:10px 0 0 10px;padding:12px 10px 12px 14px;color:var(--warm);min-height:48px}
.pre input{border-radius:0 10px 10px 0}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.chk input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--blue)}
.chk .why{color:var(--warm);font-size:.8125rem;display:block;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;margin-top:24px;min-height:52px;
  background:#F2F2F2;color:#0B0B0B;border:0;border-radius:12px;font-weight:700;cursor:pointer}
.btn[disabled]{opacity:.5;cursor:default}
.msg{margin-top:14px;font-size:.9375rem;min-height:1.6em}
.msg.ok{color:var(--good)}
.msg.no{color:var(--bad)}
.tail{color:var(--warm);font-size:.875rem;margin-top:22px}
footer{border-top:1px solid var(--line);padding:24px clamp(16px,4vw,40px);color:var(--warm);font-size:.875rem;text-align:center}
footer a{color:var(--bone-2)}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="../">허봇스<small>HEOBOTSS</small></a>
  <nav><span id="who" hidden></span><a href="#" id="logout" hidden>로그아웃</a></nav>
</header>

<main>
  <h1>내 프로필</h1>
  <p class="lead">한 번만 채워 두면 됩니다. 성적표와 혜택이 이 정보로 찾아갑니다.</p>

  <div id="authBox"></div>

  <form class="card" id="form" hidden>
    <label>
      <span class="k">이메일</span>
      <input type="email" id="email" readonly disabled>
    </label>

    <label>
      <span class="k">이름</span>
      <span class="why">성적표 카드와 본인 페이지에 이 이름이 나옵니다.</span>
      <input type="text" id="name" maxlength="20" autocomplete="name" placeholder="홍길동">
    </label>

    <label>
      <span class="k">인스타그램 아이디</span>
      <span class="why">스토리에 @heobotss 를 멘션하시면 이 아이디로 찾아 혜택을 드립니다. @ 없이 적어 주세요.</span>
      <span class="pre"><span>@</span><input type="text" id="instagram" maxlength="30" autocapitalize="off"
        autocomplete="off" spellcheck="false" placeholder="my_id"></span>
    </label>

    <label>
      <span class="k">센터 이름 <span style="color:var(--warm);font-weight:400">(선택)</span></span>
      <span class="why">같은 센터 동료가 들어오면 「우리 센터」 비교가 열립니다. 비워 두셔도 됩니다.</span>
      <input type="text" id="center" maxlength="40" placeholder="○○ 피트니스">
    </label>

    <label>
      <span class="k">연락처 <span style="color:var(--warm);font-weight:400">(선택)</span></span>
      <span class="why">성적표가 나오면 문자로 알려 드립니다. 하이픈은 넣으셔도 됩니다.</span>
      <input type="tel" id="phone" maxlength="13" inputmode="numeric" autocomplete="tel" placeholder="010-1234-5678">
    </label>

    <div class="chk">
      <input type="checkbox" id="night">
      <label for="night" style="margin:0">
        밤에도 받아도 괜찮습니다 (21시~8시)
        <span class="why">선택입니다. 체크하지 않으시면 낮에만 보냅니다. 광고 수신 동의와는 별개입니다.</span>
      </label>
    </div>

    <button class="btn" id="save" type="submit">저장</button>
    <p class="msg" id="msg"></p>
    <p class="tail">언제든 다시 와서 고칠 수 있습니다. 지워 달라고 하시면 바로 지웁니다.</p>
  </form>
</main>

<footer>
  허봇스 · 대표 허재윤 · 사업자등록번호 636-04-03949 · gjwodbs77@gmail.com ·
  <a href="../policy/privacy.html">개인정보 처리방침</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../vod/auth.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var sb = window.HB.sb, 내메일 = "";

  function 보여주기(값) {
    $("#email").value = 내메일;
    $("#name").value = 값.name || "";
    $("#instagram").value = 값.instagram || "";
    $("#center").value = 값.center || "";
    $("#phone").value = 값.phone || "";
    $("#night").checked = !!값.night_consent;
  }

  function 말(t, 좋음) {
    var m = $("#msg"); m.textContent = t; m.className = "msg" + (t ? (좋음 ? " ok" : " no") : "");
  }

  async function boot() {
    var s = await window.HB.session();
    if (!s) {
      window.HB.mountAuth($("#authBox"), function () { location.reload(); },
        { lead: "수업일지·강의실과 같은 계정입니다." });
      return;
    }
    내메일 = (s.user.email || "").toLowerCase();
    $("#authBox").hidden = true;
    $("#form").hidden = false;
    $("#logout").hidden = false;
    $("#who").hidden = false;
    $("#who").textContent = 내메일;
    $("#logout").onclick = async function (e) {
      e.preventDefault(); await sb.auth.signOut(); location.reload();
    };
    try {
      var r = await sb.from("contacts")
        .select("name,instagram,center,phone,night_consent").eq("email", 내메일).maybeSingle();
      보여주기(r.data || {});
    } catch (e) { 보여주기({}); }
  }

  $("#form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var 이름 = $("#name").value.trim();
    var 인스타 = $("#instagram").value.trim().replace(/^@/, "").toLowerCase();
    var 폰 = $("#phone").value.replace(/[^0-9]/g, "");
    if (!이름) { 말("이름을 적어 주세요", false); return; }
    if (인스타 && !/^[a-z0-9._]{1,30}$/.test(인스타)) { 말("인스타 아이디는 영문·숫자·. _ 만 됩니다", false); return; }
    if (폰 && !/^0[0-9]{8,10}$/.test(폰)) { 말("연락처는 숫자만, 0으로 시작해 9~11자리입니다", false); return; }

    $("#save").disabled = true; 말("저장하는 중…", true);
    var 줄 = {
      email: 내메일, name: 이름, instagram: 인스타 || null,
      center: $("#center").value.trim() || null, phone: 폰 || null,
      night_consent: $("#night").checked,
      night_consent_at: $("#night").checked ? new Date().toISOString() : null,
      first_via: "profile"
    };
    var r = await sb.from("contacts").upsert(줄, { onConflict: "email" }).select().maybeSingle();
    $("#save").disabled = false;
    if (r.error) {
      var t = String(r.error.message || "");
      if (/contacts_instagram_uniq|duplicate/i.test(t)) 말("이미 다른 계정이 쓰고 있는 인스타 아이디입니다", false);
      else 말("저장하지 못했습니다 — " + t, false);
      return;
    }
    말("저장했습니다", true);
  });

  boot();
})();
</script>
</body>
</html>
