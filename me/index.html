<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 프로필 — 허봇스</title>
<meta name="description" content="허봇스 멤버십·성적표에 쓰이는 내 정보를 한 번만 채워 둡니다.">
<meta name="robots" content="noindex,follow">
<link rel="icon" href="../favicon.png" type="image/png">
<style>
/* 내 프로필 화면(/me/) 새 디자인 — 11-10. 생김새만 바꾼다(가입 화면 join.css 와 같은 결).
   교체 때 site\me\index.html 의 첫 스타일 블록을 이 내용으로 갈아 끼운다(_합치기_교체.py 「옷」 단계). 선택자·id·[hidden] 은 옛 것 그대로.
   로그인 전에는 vod/auth.js 가 그리는 로그인 상자(.card.auth · h2 · .note · 비밀번호 칸)가 나온다 — 그것도 여기서 입힌다 */
@font-face{font-family:'Pretend';font-style:normal;font-weight:400;font-display:swap;src:url('../fonts/pretendard-400.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-style:normal;font-weight:500;font-display:swap;src:url('../fonts/pretendard-500.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-style:normal;font-weight:700;font-display:swap;src:url('../fonts/pretendard-700.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-style:normal;font-weight:900;font-display:swap;src:url('../fonts/pretendard-900.woff2') format('woff2')}
:root{color-scheme:dark;
  /* 이름은 옛 것 그대로(화면 안 style 속성이 var(--warm) 등을 쓴다), 값만 새 길의 색 */
  --ink:#0A0A0B;--ink-2:#141416;--ink-3:#0C0C0E;--bone:#F2F0EB;--bone-2:#C9C7C2;--warm:#A3A39E;
  --line:#242426;--line-2:rgba(242,240,235,.16);--blue:#4F86F7;--good:#5FBF8A;--bad:#E07A6B;--kakao:#FEE500;
  --sans:"Pretend","Pretendard","Apple SD Gothic Neo",-apple-system,system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{position:relative;margin:0;min-height:100vh;background:var(--ink);color:var(--bone);font-family:var(--sans);font-size:16px;line-height:1.7;word-break:keep-all;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 520px at 50% -120px,rgba(79,134,247,.20),transparent 70%),radial-gradient(600px 400px at 100% 30%,rgba(79,134,247,.07),transparent 70%)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(242,240,235,.10) 1px,transparent 1.2px);background-size:28px 28px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%)}
body>*{position:relative;z-index:1}
a{color:var(--bone);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
[hidden]{display:none!important}
/* 옛 머리(교체 때 새 메뉴바로 바뀐다. 바뀌기 전에도 같은 결로 보이게) */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;min-height:64px;padding:0 clamp(16px,4vw,32px);background:rgba(10,10,11,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--bone);text-decoration:none}
.logo small{display:none}
.top nav a{color:var(--warm);text-decoration:none;font-size:15px;min-height:44px;display:inline-flex;align-items:center}
.top nav{display:flex;align-items:center;gap:16px;font-size:14px;color:var(--warm)}
#who{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:600px;margin:0 auto;padding:clamp(48px,9vw,88px) 16px 80px}
h1{font-size:clamp(32px,6vw,48px);font-weight:900;line-height:1.16;letter-spacing:-.04em;margin:0 0 16px}
.lead{color:var(--bone-2);margin:0 0 32px;font-size:17px;line-height:1.7}
.card{padding:32px;border:1px solid var(--line-2);border-radius:24px;background:rgba(242,240,235,.03);
  box-shadow:inset 0 1px 0 rgba(242,240,235,.06),0 24px 64px rgba(0,0,0,.45)}
@media (max-width:520px){.card{padding:24px 16px;border-radius:20px}}
.card h2{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:0 0 12px}
.note{color:var(--warm);font-size:14px;line-height:1.7}
.note a{color:var(--bone-2)}
label{display:block;margin-top:24px;font-size:15px;font-weight:500;color:var(--bone-2)}
label:first-of-type{margin-top:0}
.auth label{margin:18px 0 8px}
label .k{display:block;margin-bottom:6px;color:var(--bone);font-weight:700}
label .why{display:block;color:var(--warm);font-size:13px;font-weight:400;line-height:1.65;margin-bottom:10px}
.mine{display:flex;align-items:center;gap:12px;margin:0 0 20px;color:var(--bone-2);font-size:15px}
.mine img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--ink-3);border:1px solid var(--line-2)}
input[type=text],input[type=email],input[type=tel],input[type=password]{width:100%;min-height:54px;background:var(--ink-3);border:1px solid var(--line-2);border-radius:14px;
  color:var(--bone);font:inherit;font-size:16px;padding:12px 16px;outline:none;box-shadow:inset 0 1px 2px rgba(0,0,0,.5);transition:border-color .2s,box-shadow .2s}
input::placeholder{color:#62625E}
input:focus{border-color:var(--blue);box-shadow:inset 0 1px 2px rgba(0,0,0,.5),0 0 0 4px rgba(79,134,247,.16)}
input:disabled{color:var(--warm);opacity:.8}
.pre{display:flex;align-items:stretch}
.pre span{display:flex;align-items:center;background:var(--ink-3);border:1px solid var(--line-2);border-right:0;border-radius:14px 0 0 14px;padding:0 10px 0 16px;color:var(--warm);min-height:54px}
.pre input{border-radius:0 14px 14px 0}
.chk{display:flex;gap:12px;align-items:flex-start;margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
.chk input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--blue)}
.chk label{color:var(--bone-2)}
.chk .why{color:var(--warm);font-size:13px;display:block;margin-top:2px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:60px;margin-top:28px;border:0;border-radius:999px;
  padding:16px 28px;background:var(--blue);color:#0A0A0B;font-weight:700;font-size:17.5px;letter-spacing:-.01em;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 36px rgba(79,134,247,.35);transition:background-color .2s,box-shadow .2s,transform .2s}
.btn:hover{background:#6B9CFF;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 16px 48px rgba(79,134,247,.5);transform:translateY(-1px)}
.btn[disabled],.btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none;transform:none}
#aKk{min-height:56px;border-radius:999px!important}
.msg{margin-top:14px;font-size:15px;min-height:1.6em;color:var(--bad)}
.msg.ok{color:var(--good)}
.msg.no{color:var(--bad)}
.tail{color:var(--warm);font-size:14px;margin-top:20px}
footer{position:relative;z-index:1;border-top:1px solid var(--line);padding:28px clamp(16px,4vw,40px);color:var(--warm);font-size:13px;line-height:1.9;text-align:center}
footer a{color:var(--bone-2)}
@media (prefers-reduced-motion:reduce){.btn,.btn:hover{transition:none;transform:none}}

/* 11-10 체크박스 한 벌 — 새 화면과 같은 꼴(얇은 테두리, 고르면 파랑) */
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:20px;height:20px;flex:0 0 20px;margin-top:2px;border:1.5px solid rgba(242,240,235,.38);border-radius:6px;background:transparent;display:inline-grid;place-content:center;cursor:pointer;transition:background-color .15s,border-color .15s}
input[type=checkbox]::before{content:"";width:10px;height:5px;border-left:2px solid #0A0A0B;border-bottom:2px solid #0A0A0B;transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .15s}
input[type=checkbox]:checked{background:#4F86F7;border-color:#4F86F7}
input[type=checkbox]:checked::before{transform:translateY(-1px) rotate(-45deg) scale(1)}
input[type=checkbox]:disabled{opacity:.4;cursor:default}
input[type=checkbox]:focus-visible{outline:2px solid #4F86F7;outline-offset:2px}
</style>
<style id="hb-bar-css">.hb-bar{position:sticky;top:0;z-index:50;height:64px;background:rgba(10,10,11,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #242426;font-family:"P","Pretend",system-ui,-apple-system,"Malgun Gothic",sans-serif}.hb-bar .hb-in{max-width:1312px;height:100%;margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}.hb-bar a{color:#ABABA6;text-decoration:none}.hb-bar .hb-logo{color:#F2F0EB;font-size:20px;font-weight:800;letter-spacing:-.02em;min-height:44px;display:inline-flex;align-items:center}.hb-bar nav{display:flex;align-items:center;gap:16px;font-size:16px}.hb-bar nav a{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}.hb-bar nav a:hover{color:#F2F0EB}.hb-bar nav a.hb-me{color:#F2F0EB;border:1px solid rgba(242,240,235,.18);border-radius:999px;padding:0 16px}.hb-bar .hb-keep{display:flex;gap:12px;align-items:center;font-size:14px;color:#ABABA6}.hb-bar .hb-keep:empty{display:none}@media (max-width:720px){.hb-bar .hb-in{padding:0 16px}.hb-bar nav{gap:2px;font-size:13px}.hb-bar nav .hb-wide{display:none}.hb-bar nav a.hb-me{padding:0 12px}.hb-bar .hb-keep{display:none}}</style>
</head>
<body>
<header class="hb-bar"><div class="hb-in"><a class="hb-logo" href="/">허봇스</a><span class="hb-keep"><span id="who" hidden></span><a href="#" id="logout" hidden>로그아웃</a></span><nav aria-label="주 메뉴"><a href="/trainer/#t-check">30초 진단</a><a class="hb-wide" href="/tools/">프로그램</a><a href="/courses/">강의</a><a href="/plan/">가격</a><a class="hb-wide" href="/free/">무료 자료</a><a class="hb-me" href="/vod/">로그인</a></nav></div></header><script>try{if(localStorage.getItem("hb-auth"))document.querySelector(".hb-bar .hb-me").textContent="내 강의실"}catch(e){}</script>

<main>
  <h1>내 프로필</h1>
  <p class="lead">한 번만 채워 두면 됩니다. 성적표와 혜택이 이 정보로 찾아갑니다.</p>

  <div id="authBox"></div>

  <div class="mine" id="mine" hidden>
    <img id="pic" alt="" hidden>
    <span id="nick"></span>
  </div>

  <form class="card" id="form" hidden>
    <label>
      <span class="k">이메일</span>
      <input type="email" id="email" readonly disabled>
    </label>

    <label>
      <span class="k">이름</span>
      <span class="why">성적표 카드와 본인 페이지에 이 이름이 나옵니다.</span>
      <input type="text" id="name" maxlength="20" autocomplete="name" placeholder="홍길동">
    </label>

    <label>
      <span class="k">인스타그램 아이디</span>
      <span class="why">스토리에 @heobotss 를 멘션하시면 이 아이디로 찾아 혜택을 드립니다. @ 없이 적어 주세요.</span>
      <span class="pre"><span>@</span><input type="text" id="instagram" maxlength="30" autocapitalize="off"
        autocomplete="off" spellcheck="false" placeholder="my_id"></span>
    </label>

    <label>
      <span class="k">출생연도 <span style="color:var(--warm);font-weight:400">(선택)</span></span>
      <span class="why">연차·연령대에 맞는 자료를 골라 드리는 데만 씁니다. 생월·생일은 받지 않습니다.</span>
      <input type="tel" id="year" maxlength="4" inputmode="numeric" placeholder="예: 1992">
    </label>

    <label>
      <span class="k">센터 이름 <span style="color:var(--warm);font-weight:400">(선택)</span></span>
      <span class="why">같은 센터 동료가 들어오면 「우리 센터」 비교가 열립니다. 비워 두셔도 됩니다.</span>
      <input type="text" id="center" maxlength="40" placeholder="○○ 피트니스">
    </label>

    <label>
      <span class="k">연락처 <span style="color:var(--warm);font-weight:400">(선택)</span></span>
      <span class="why">성적표가 나오면 문자로 알려 드립니다. 하이픈은 넣으셔도 됩니다.</span>
      <input type="tel" id="phone" maxlength="13" inputmode="numeric" autocomplete="tel" placeholder="010-1234-5678">
    </label>

    <div class="chk">
      <input type="checkbox" id="night">
      <label for="night" style="margin:0">
        밤에도 받아도 괜찮습니다 (21시~8시)
        <span class="why">선택입니다. 체크하지 않으시면 낮에만 보냅니다. 광고 수신 동의와는 별개입니다.</span>
      </label>
    </div>

    <button class="btn" id="save" type="submit">저장</button>
    <p class="msg" id="msg"></p>
    <p class="tail">언제든 다시 와서 고칠 수 있습니다. 지워 달라고 하시면 바로 지웁니다.</p>
  </form>
</main>

<footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../vod/auth.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var sb = window.HB.sb, 내메일 = "", 있던줄 = false;

  function 보여주기(값) {
    $("#email").value = 내메일;
    $("#name").value = 값.name || "";
    $("#instagram").value = 값.instagram || "";
    $("#center").value = 값.center || "";
    $("#phone").value = 값.phone || "";
    $("#year").value = 값.birth_year || "";
    $("#night").checked = !!값.night_consent;
  }

  function 말(t, 좋음) {
    var m = $("#msg"); m.textContent = t; m.className = "msg" + (t ? (좋음 ? " ok" : " no") : "");
  }

  async function boot() {
    var s = await window.HB.session();
    if (!s) {
      window.HB.mountAuth($("#authBox"), function () { location.reload(); },
        { lead: "수업일지·강의실과 같은 계정입니다." });
      return;
    }
    내메일 = (s.user.email || "").toLowerCase();
    $("#authBox").hidden = true;
    $("#form").hidden = false;
    $("#logout").hidden = false;
    $("#who").hidden = false;
    $("#who").textContent = 내메일;
    $("#logout").onclick = async function (e) {
      e.preventDefault(); await sb.auth.signOut(); location.reload();
    };
    /* 카카오로 들어오신 분 — 받은 이름·사진을 여기에 보여 준다 (동의하신 항목만 온다) */
    var m = s.user.user_metadata || {};
    var 별명 = m.name || m.full_name || m.nickname || "";
    var 사진 = m.avatar_url || m.picture || "";
    if (별명 || 사진) {
      $("#mine").hidden = false;
      $("#nick").textContent = 별명 ? 별명 + " 선생님" : "";
      if (사진) { $("#pic").src = 사진; $("#pic").hidden = false; }
    }
    try {
      var r = await sb.from("contacts")
        .select("name,instagram,center,phone,night_consent,birth_year").eq("email", 내메일).maybeSingle();
      있던줄 = !!(r && r.data);
      보여주기(r.data || {});
      if (!$("#name").value && 별명) $("#name").value = 별명;   /* 한 번 덜 적으시게 */
    } catch (e) { 보여주기({}); if (별명) $("#name").value = 별명; }
  }

  $("#form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var 이름 = $("#name").value.trim();
    var 인스타 = $("#instagram").value.trim().replace(/^@/, "").toLowerCase();
    var 폰 = $("#phone").value.replace(/[^0-9]/g, "");
    if (!이름) { 말("이름을 적어 주세요", false); return; }
    if (인스타 && !/^[a-z0-9._]{1,30}$/.test(인스타)) { 말("인스타 아이디는 영문·숫자·. _ 만 됩니다", false); return; }
    if (폰 && !/^0[0-9]{8,10}$/.test(폰)) { 말("연락처는 숫자만, 0으로 시작해 9~11자리입니다", false); return; }

    $("#save").disabled = true; 말("저장하는 중…", true);
    var 줄 = {
      email: 내메일, name: 이름, instagram: 인스타 || null,
      center: $("#center").value.trim() || null, phone: 폰 || null,
      night_consent: $("#night").checked,
      night_consent_at: $("#night").checked ? new Date().toISOString() : null
    };
    var y = parseInt($("#year").value, 10);
    줄.birth_year = (y >= 1930 && y <= new Date().getFullYear() - 13) ? y : null;
    if (!있던줄) 줄.first_via = "profile";   /* 처음 들어온 길은 한 번만 적는다 — 카카오로 온 기록을 지우지 않게 */
    var r = await sb.from("contacts").upsert(줄, { onConflict: "email" }).select().maybeSingle();
    $("#save").disabled = false;
    if (r.error) {
      var t = String(r.error.message || "");
      if (/contacts_instagram_uniq|duplicate/i.test(t)) 말("이미 다른 계정이 쓰고 있는 인스타 아이디입니다", false);
      else 말("저장하지 못했습니다 — " + t, false);
      return;
    }
    말("저장했습니다", true);
  });

  boot();
})();
</script>
</body>
</html>
