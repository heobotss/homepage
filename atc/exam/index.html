<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>수료 시험 — ATC LV1 4주 챌린지</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<style>
/* 수료 시험 — 4주차에 열린다. 내 과정 홈과 같은 토큰(09-17 무채색판).
   정답은 이 화면에 없다. 문제·보기만 서버에서 받고 채점도 서버가 한다.

   한 문항씩 보여주는 이유 — 20문항이 한꺼번에 보이면 시작 전에 총량이 먼저 보인다.
   하나씩이면 「이거 하나만」이 스무 번이 된다. 고를 때마다 점 하나가 차서 반응이 20번 생긴다.
   고른 답은 이 기기에 바로 저장한다. 전화가 와도, 창이 닫혀도 이어서 본다.

   신호색: 초록=맞음 · 앰버=봐야 할 것. 캔버스 안 쓴다(iOS 카톡 웹뷰에서 흰 칸이 된다). */
@font-face{font-family:'Pretend';font-style:normal;font-weight:400;font-display:swap;src:url('../../fonts/pretendard-400.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-style:normal;font-weight:500;font-display:swap;src:url('../../fonts/pretendard-500.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-style:normal;font-weight:700;font-display:swap;src:url('../../fonts/pretendard-700.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-style:normal;font-weight:900;font-display:swap;src:url('../../fonts/pretendard-900.woff2') format('woff2')}
@font-face{font-family:'Bahn';font-style:normal;font-weight:700;font-display:swap;src:url('../../fonts/bahn-700.woff2') format('woff2')}
:root{
  color-scheme:dark;
  --ink:#0A0A0A; --ink-2:#111111; --ink-3:#171717;
  --bone:#F2F2F2; --bone-2:#BDBDBD; --warm:#8E8E8E;
  --line:#222222; --line-2:#2F2F2F;
  --blue:#4F86F7; --bad:#E07A6B; --good:#5FBF8A; --warn:#E0A85F;
  --sans:"Pretend","Pretendard","Apple SD Gothic Neo",-apple-system,system-ui,sans-serif;
  --tech:"Bahn","Bahnschrift",var(--sans);
  --dock:78px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans);font-size:1rem;line-height:1.75;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
a{color:var(--bone)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
[hidden]{display:none!important}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);
     padding-left:max(clamp(16px,4vw,40px),env(safe-area-inset-left));padding-right:max(clamp(16px,4vw,40px),env(safe-area-inset-right))}
.logo{font-weight:700;font-size:1.05rem;letter-spacing:-.02em;color:var(--bone);text-decoration:none;flex:none}
.logo small{font-family:var(--tech);font-size:.625rem;color:var(--blue);letter-spacing:.12em;margin-left:6px;vertical-align:2px}
.top nav{display:flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--warm);min-width:0}
.top nav a{color:var(--warm);text-decoration:none;flex:none;min-height:44px;display:flex;align-items:center;padding:0 6px}
.top nav a:hover{color:var(--bone)}
.who{color:var(--warm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}

main{flex:1;width:100%;max-width:560px;margin:0 auto;
     padding:0 clamp(16px,4vw,24px) calc(var(--dock) + 28px + env(safe-area-inset-bottom));
     padding-left:max(clamp(16px,4vw,24px),env(safe-area-inset-left));
     padding-right:max(clamp(16px,4vw,24px),env(safe-area-inset-right))}
h1{font-size:clamp(1.5rem,5vw,2rem);line-height:1.25;letter-spacing:-.04em;font-weight:900;margin:0}
h2{font-size:.8125rem;font-family:var(--tech);letter-spacing:.12em;color:var(--warm);font-weight:700;margin:0 0 10px;text-transform:uppercase}
p{margin:10px 0 0}
.note{font-size:.875rem;color:var(--warm)}
section{margin:28px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:13px 22px;font-size:.9375rem;font-weight:700;cursor:pointer;background:#F2F2F2;color:#0A0A0A;text-decoration:none;transition:background .15s,transform .15s;min-height:48px}
.btn:hover{background:#FFF}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.line{background:transparent;color:var(--bone);border:1px solid var(--line-2)}
.btn.line:hover{border-color:var(--bone-2)}
.btn.wide{width:100%}

.card{border:1px solid var(--line);border-radius:14px;background:var(--ink-2);padding:20px}
.card h1{font-size:1.25rem}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 0;padding:0;list-style:none}
.facts li{font-size:.875rem;color:var(--bone-2)}
.facts b{font-family:var(--tech);color:var(--bone)}

/* 위 진행 점 — 고를 때마다 한 칸이 찬다 */
.pin{position:sticky;top:0;z-index:5;background:linear-gradient(var(--ink) 72%,transparent);padding:12px 0 14px;margin:0 0 4px}
.dots{display:flex;gap:3px;align-items:center}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line);transition:background .25s}
.dots i.on{background:var(--blue)}
.dots i.cur{background:var(--bone)}
.dots i.gap{flex:0 0 7px;background:transparent}
.pinTxt{display:flex;justify-content:space-between;align-items:baseline;margin:9px 0 0;font-size:.8125rem;color:var(--warm)}
.pinTxt b{font-family:var(--tech);color:var(--bone-2)}

/* 한 문항 */
.q{padding:10px 0 0}
.qArea{font-family:var(--tech);font-size:.75rem;letter-spacing:.1em;color:var(--blue)}
.qs{margin:8px 0 0;font-size:1.0625rem;font-weight:700;line-height:1.55;letter-spacing:-.02em}
.qm{display:inline-flex;align-items:center;margin:10px 0 0;font-size:.8125rem;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:3px 9px}
.opts{margin:16px 0 0;display:flex;flex-direction:column;gap:9px}
.opts label{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:var(--ink-2);cursor:pointer;font-size:.9375rem;line-height:1.5;min-height:48px;transition:border-color .15s,background .15s}
.opts label:hover{border-color:var(--line-2)}
.opts input{margin:4px 0 0;accent-color:var(--blue);flex:none;width:19px;height:19px}
.opts label:has(input:checked){border-color:var(--blue);background:var(--ink-3)}
.opts label:has(input:checked) span{color:var(--bone)}
.opts span{color:var(--bone-2)}
.hint{margin:12px 0 0;font-size:.8125rem;color:var(--warn)}

/* 블록 끝 쉼표 */
.blk{text-align:center;padding:38px 0 0}
.blk b{display:block;font-family:var(--tech);font-size:2rem;color:var(--good)}
.blk p{color:var(--bone-2)}

/* 아래 고정 막대 */
.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,10,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);
      padding:12px clamp(16px,4vw,24px) calc(12px + env(safe-area-inset-bottom))}
.dock .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.dock .in .btn{flex:1}
.dock .btn.nav{flex:0 0 auto;padding:13px 16px}

/* 결과 */
.score{text-align:center;padding:26px 0 6px}
.score .big{font-family:var(--tech);font-size:4rem;line-height:1;letter-spacing:-.02em}
.score .big.ok{color:var(--good)}
.score .big.no{color:var(--warn)}
.score .cap{font-size:.8125rem;color:var(--warm);margin-top:8px}
.areas{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.areas>div{display:flex;align-items:center;gap:12px;background:var(--ink-2);padding:14px 15px;font-size:.9375rem;opacity:0;transform:translateY(4px);transition:opacity .35s,transform .35s}
.areas>div.in{opacity:1;transform:none}
.areas .k{flex:1;min-width:0}
.areas .pips{display:flex;gap:4px;flex:none}
.areas .pips i{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.areas .pips i.ok{background:var(--good)}
.areas .n{font-family:var(--tech);font-size:.8125rem;color:var(--warm);flex:none;min-width:30px;text-align:right}
.rows{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rows>div{display:flex;align-items:center;gap:10px;background:var(--ink-2);padding:13px 15px;font-size:.9375rem}
.rows .k{flex:1;min-width:0}
.rows .v{font-family:var(--tech);color:var(--warm);flex:none}
.rows .v.ok{color:var(--good)}
.msg{margin:14px 0 0;font-size:.875rem;color:var(--warn)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 0}
</style>
</head>
<body>

<header class="top">
  <a class="logo" href="../../">허봇스<small>ATC LV1</small></a>
  <nav>
    <span id="who" class="who" hidden></span>
    <a href="../my/" id="backLink">내 과정</a>
    <a href="#" id="logout" hidden>로그아웃</a>
  </nav>
</header>

<main>
  <div id="gate">
    <p class="note" id="gateMsg">확인하는 중…</p>
    <div id="authBox"></div>
    <p id="gateRetry" hidden><button class="btn line" id="retry">다시 시도</button></p>
  </div>

  <!-- ① 들어가기 전 -->
  <div id="intro" hidden>
    <section>
      <h1 id="introH1">LV1 수료 시험</h1>
      <p class="note" id="introLead"></p>
    </section>
    <section>
      <div class="card">
        <h1 id="introTitle">4T 모의고사</h1>
        <ul class="facts" id="introFacts"></ul>
        <p class="note" id="introWhen"></p>
        <p style="margin-top:18px"><button class="btn wide" id="start" hidden>시작하기</button></p>
        <p class="note" id="resumeTip" hidden></p>
      </div>
    </section>
    <section id="bestBox" hidden>
      <h2>지금까지</h2>
      <div class="rows" id="bestRows"></div>
    </section>
    <section>
      <h2>미리 알아두실 것</h2>
      <div class="rows" id="introRows"></div>
      <p class="note" id="introTail"></p>
    </section>
  </div>

  <!-- ② 응시 -->
  <div id="sheet" hidden>
    <div class="pin">
      <div class="dots" id="dots"></div>
      <div class="pinTxt"><span id="pinArea"></span><span><b id="pinNo">1</b> / <b id="pinAll">20</b></span></div>
    </div>
    <div id="qBox"></div>
  </div>

  <!-- ③ 결과 -->
  <div id="done" hidden>
    <section>
      <div class="score">
        <div class="big" id="rScore"></div>
        <div class="cap" id="rCap"></div>
      </div>
      <p class="note" id="rLead" style="text-align:center"></p>
    </section>
    <section>
      <h2>영역별</h2>
      <div class="areas" id="rAreas"></div>
      <p class="note" id="rAreaNote"></p>
    </section>
    <section>
      <div class="acts">
        <button class="btn" id="again">다시 보기</button>
        <a class="btn line" href="../my/">내 과정으로</a>
        <a class="btn line" id="againExam" href="./" hidden>수료 시험 보기</a>
      </div>
    </section>
  </div>
</main>

<div class="dock" id="dock" hidden>
  <div class="in">
    <button class="btn line nav" id="prev" aria-label="앞 문항">←</button>
    <button class="btn" id="next">다음</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="../../vod/auth.js"></script>
<script>
(function () {
  "use strict";
  if (!window.HB || !window.HB.sb) {            // CDN 이 안 열렸을 때 「확인하는 중…」에 갇히지 않게
    document.getElementById("gateMsg").textContent =
      "연결이 좋지 않아 화면을 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.";
    return;
  }
  var sb = window.HB.sb, esc = window.HB.esc;
  var $ = function (s) { return document.querySelector(s); };
  var ST = null, QS = [], PICK = {}, CUR = 0, SENT = false, AUTO = null;
  // 뼈 시험은 같은 화면을 빌려 쓴다. 부르는 함수 이름만 갈아끼운다
  var BONE = /(\?|&)bone/.test(location.search);
  var FN = BONE
    ? { state: "atc_bone_state", sheet: "atc_bone_sheet", submit: "atc_bone_submit" }
    : { state: "atc_exam_state", sheet: "atc_exam_sheet", submit: "atc_exam_submit" };

  /* 고른 답은 바로 이 기기에 저장한다 — 전화가 와도, 창이 닫혀도 이어서 본다 */
  // 두 시험이 같은 화면을 쓰므로 종류를 키에 넣는다. 안 그러면 답이 섞인다
  function key() { return "atc-exam-" + (BONE ? "bone:" : "exam:") + ((ST && ST.paper) || "?"); }
  // 지금 받은 문제지가 어떤 문제지인지 한 줄로 적어 둔다.
  // 모의고사는 100문항 중 20개를 매번 새로 뽑으므로, 저장해 둔 답을 다음에 받은
  // 문제지에 그대로 얹으면 1번 답이 남의 1번 자리에 들어가 조용히 틀린 채점이 된다.
  function 문제지표() { return QS.map(function (q) { return q.stem.slice(0, 18); }).join("|"); }
  function keep() {
    try { localStorage.setItem(key(), JSON.stringify({ at: Date.now(), cur: CUR, pick: PICK, sig: 문제지표() })); }
    catch (e) { /* 사파리 비공개 모드 등 — 저장이 안 돼도 시험은 계속된다 */ }
  }
  function kept() {
    try {
      var v = JSON.parse(localStorage.getItem(key()) || "null");
      if (!v || !v.pick || Object.keys(v.pick).length === 0) return null;
      if (Date.now() - (v.at || 0) > 1000 * 60 * 60 * 24 * 3) return null;   // 사흘 지난 건 버린다
      return v;
    } catch (e) { return null; }
  }
  function drop() { try { localStorage.removeItem(key()); } catch (e) {} }

  function show(id) {
    ["gate", "intro", "sheet", "done"].forEach(function (k) { $("#" + k).hidden = (k !== id); });
    $("#dock").hidden = (id !== "sheet");
    $("#backLink").hidden = (id === "sheet");     // 시험 중에 눌러서 날리는 일이 없게
  }

  /* 다시 보기까지 남은 시간 --------------------------------------
     찍어서 통과하는 길을 막으려고 네 번째 응시부터 3분을 둔다.
     벌이 아니라 「틀린 곳을 한 번 보고 오시라」는 뜻이므로 그렇게 말한다. */
  var WAITT = null;
  function 기다림끄기() { if (WAITT) { clearInterval(WAITT); WAITT = null; } }
  function 기다리기(sec) {
    기다림끄기();
    var s = $("#start"), tip = $("#resumeTip");
    function 그리기() {
      if (sec <= 0) {
        기다림끄기();
        s.disabled = false;
        s.textContent = "다시 보기";
        tip.hidden = true;
        return;
      }
      s.disabled = true;
      s.textContent = "다시 보기까지 " + Math.floor(sec / 60) + ":" + ("0" + (sec % 60)).slice(-2);
      tip.hidden = false;
      tip.textContent = "세 번까지는 바로 다시 보셨습니다. 이제부터는 3분을 둡니다 — " +
        "틀린 곳을 한 번 보고 오시라는 뜻입니다.";
      sec--;
    }
    그리기();
    WAITT = setInterval(그리기, 1000);
  }

  /* ① 들어가기 전 ------------------------------------------------ */
  function drawIntro() {
    $("#introH1").textContent = BONE ? "실전해부학 뼈 시험" : "LV1 수료 시험";
    document.title = (BONE ? "뼈 시험" : "수료 시험") + " — ATC LV1 4주 챌린지";
    $("#introTitle").textContent = ST.paper ? ST.paper + (BONE ? "" : " 문제지") : "문제지 준비 중";
    $("#introFacts").innerHTML =
      '<li>문항 <b>' + (ST.count || 0) + '</b>개</li>' +
      '<li>합격 <b>' + ST.need + '</b>' + (BONE ? '개' : '점') + '</li>' +
      '<li>다시 보기 <b>제한 없음</b>' + (BONE ? ' (네 번째부터 3분)' : '') + '</li>';

    var open = !!ST.open, lead = "", when = "";
    if (BONE && ST.why === "no-paper") {
      lead = "아직 문제지가 준비되지 않았습니다.";
    } else if (BONE && ST.why === "closed") {
      lead = "응시 기간이 지났습니다.";
    } else if (BONE && ST.passed) {
      lead = "이미 통과하셨습니다. 레벨 과제 2번이 완료됐습니다.";
      when = "다시 보셔도 됩니다.";
    } else if (BONE) {
      lead = "그림 두 장을 보고 오시면 됩니다. 언제든 보실 수 있습니다.";
      when = ST.ends_on ? (kr(ST.ends_on) + "까지 몇 번이든 다시 보실 수 있습니다.")
                        : "몇 번이든 다시 보실 수 있습니다.";
    } else if (ST.why === "week") {
      lead = "4주차에 열립니다.";
      when = "지금 " + ST.week_no + "주차입니다. " + kr(ST.opens_on) + "부터 보실 수 있습니다.";
    } else if (ST.why === "before") {
      lead = "과정이 시작되면 안내해 드립니다.";
    } else if (ST.why === "closed") {
      lead = "응시 기간이 지났습니다.";
      when = kr(ST.ends_on) + "까지였습니다.";
    } else if (ST.why === "no-paper") {
      lead = "아직 문제지가 준비되지 않았습니다.";
    } else {
      lead = ST.passed ? "이미 합격하셨습니다. 더 높은 점수를 원하시면 다시 보셔도 됩니다."
                       : "지금 보실 수 있습니다.";
      when = kr(ST.ends_on) + "까지 몇 번이든 다시 보실 수 있습니다.";
    }
    $("#introLead").textContent = lead;
    $("#introWhen").textContent = when;
    $("#start").hidden = !open;

    var k = open ? kept() : null;
    $("#resumeTip").hidden = !k;
    if (k) {
      var n = Object.keys(k.pick).length;
      $("#start").textContent = "이어서 보기";
      $("#resumeTip").textContent = n + "문항까지 고르신 게 남아 있습니다. 그 자리에서 이어집니다.";
    } else {
      $("#start").textContent = (ST.tries > 0) ? "다시 보기" : "시작하기";
    }
    // 뼈 시험은 네 번째부터 3분을 둔다. 남은 시간을 그 자리에서 센다
    if (open && ST.wait > 0) 기다리기(ST.wait); else 기다림끄기();

    $("#introRows").innerHTML =
      row("한 번에 한 문항씩 나옵니다", (ST.count || 0) + "문항", null) +
      row("합격", BONE ? (ST.need + " / " + ST.count + "개") : (ST.need + "점"), null) +
      row("고른 답은 이 기기에 바로 저장됩니다", "이어서 보기", null) +
      row("다시 보기", BONE ? "횟수 제한 없음 · 네 번째부터 3분" : "횟수 제한 없음", null);
    $("#introTail").innerHTML = "중간에 전화가 오거나 창이 닫혀도 괜찮습니다. 다시 들어오시면 " +
      "<b>고르던 자리에서 이어집니다.</b> " + (BONE
        ? "통과하시면 <b>레벨 과제 2번이 자동으로 완료</b>됩니다."
        : "걸러내려는 시험이 아니라 아실 때까지 보시라는 시험입니다.");

    $("#bestBox").hidden = !(ST.tries > 0);
    if (ST.tries > 0) {
      $("#bestRows").innerHTML =
        row("최고 점수", ST.best + (BONE ? "개" : "점"), ST.best >= ST.need) +
        row("응시 횟수", ST.tries + "번", null) +
        (ST.last ? row("마지막 응시", ST.last.at, null) : "");
    }
    show("intro");
  }
  function row(k, v, ok) {
    return '<div><span class="k">' + esc(k) + '</span><span class="v' +
      (ok === true ? " ok" : "") + '">' + esc(v) + '</span></div>';
  }
  function kr(d) {
    if (!d) return "";
    var p = String(d).split("-");
    return p.length === 3 ? (+p[1]) + "월 " + (+p[2]) + "일" : String(d);
  }

  /* ② 응시 ------------------------------------------------------- */
  function 섞기(a) {                     // 다시 볼 때마다 순서가 달라진다 — 자리 외우기로 통과하지 못하게
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  async function startExam() {
    $("#start").disabled = true;
    try {
      var r = await sb.rpc(FN.sheet);
      if (r.error) throw r.error;
      QS = (r.data || []).map(function (q) {
        var idx = 섞기((q.options || []).map(function (_, i) { return i + 1; }));
        return { no: q.no, stem: q.stem, area: q.area, multi: q.multi,
                 opts: idx.map(function (v) { return { v: v, t: q.options[v - 1] }; }) };
      });
      // 저장해 둔 답은 「그때 그 문제지」일 때만 되살린다
      var k = kept(), 같음 = !!(k && k.sig === 문제지표());
      PICK = 같음 ? k.pick : {};
      CUR = (같음 && typeof k.cur === "number" && k.cur < QS.length) ? k.cur : 0;
      if (k && !같음) drop();
      var ns = $("#newSheet"); if (ns) ns.hidden = !(k && !같음);
      SENT = false;
      drawDots();
      drawQ();
      show("sheet");
      window.scrollTo(0, 0);
    } catch (e) {
      var msg = String((e && (e.message || e.hint)) || ""), m = msg.match(/(\d+)초 남았습니다/);
      if (m) { 기다리기(parseInt(m[1], 10)); show("intro"); }
      else alert("문제지를 불러오지 못했습니다. 잠시 뒤 다시 해 주세요.");
    } finally {
      $("#start").disabled = false;
    }
  }

  function drawDots() {
    var h = "";
    QS.forEach(function (q, i) {
      // 영역이 바뀌는 자리에 틈을 준다 (시험마다 영역 크기가 다르다)
      if (i > 0 && q.area !== QS[i - 1].area) h += '<i class="gap"></i>';
      h += '<i data-i="' + i + '"></i>';
    });
    $("#dots").innerHTML = h;
    $("#pinAll").textContent = QS.length;
  }
  function tickDots() {
    Array.prototype.forEach.call($("#dots").querySelectorAll("i[data-i]"), function (el) {
      var i = +el.getAttribute("data-i");
      el.className = (i === CUR) ? "cur" : (PICK[QS[i].no] ? "on" : "");
    });
    $("#pinNo").textContent = CUR + 1;
    $("#pinArea").textContent = QS[CUR] ? (QS[CUR].area || "") : "";
  }

  function drawQ() {
    var q = QS[CUR], got = PICK[q.no] || [];
    var type = q.multi ? "checkbox" : "radio";
    $("#qBox").innerHTML =
      '<div class="q">' +
        (q.multi ? '<div class="qm">정답이 여러 개입니다 — 해당하는 것을 모두 고르세요</div>' : '') +
        '<p class="qs">' + esc(q.stem) + '</p>' +
        '<div class="opts">' + q.opts.map(function (o) {
          return '<label><input type="' + type + '" name="q" value="' + o.v + '"' +
                 (got.indexOf(o.v) >= 0 ? " checked" : "") + '><span>' + esc(o.t) + '</span></label>';
        }).join("") + '</div>' +
        '<p class="hint" id="qHint" hidden></p>' +
      '</div>';
    $("#qBox").querySelector(".opts").addEventListener("change", onPick);
    $("#prev").disabled = (CUR === 0);
    $("#next").textContent = (CUR === QS.length - 1) ? "다 풀었습니다" : "다음";
    tickDots();
    window.scrollTo(0, 0);
  }

  function onPick() {
    var q = QS[CUR], got = [];
    $("#qBox").querySelectorAll("input:checked").forEach(function (c) { got.push(+c.value); });
    got.sort(function (a, b) { return a - b; });
    if (got.length) PICK[q.no] = got; else delete PICK[q.no];
    $("#qHint").hidden = true;
    keep();
    tickDots();
    // 단일 정답은 고르면 바로 다음으로. 다만 마지막 문항은 자동 제출하지 않는다
    if (AUTO) { clearTimeout(AUTO); AUTO = null; }
    if (!q.multi && got.length && CUR < QS.length - 1) AUTO = setTimeout(go(1), 220);
  }

  function go(d) {
    return function () {
      var q = QS[CUR], got = PICK[q.no] || [];
      if (d > 0) {
        if (!got.length) return warn("하나를 골라 주세요.");
        if (q.multi && got.length < 2) return warn("이 문항은 정답이 여러 개입니다. 해당하는 것을 모두 골라 주세요.");
      }
      if (CUR + d < 0) return;
      if (CUR + d >= QS.length) return finish();
      CUR += d; keep(); drawQ();
    };
  }
  function warn(t) { $("#qHint").hidden = false; $("#qHint").textContent = t; }

  function finish() {
    var miss = QS.map(function (q, i) { return { q: q, i: i }; })
                 .filter(function (z) {
                   var g = PICK[z.q.no] || [];
                   return !g.length || (z.q.multi && g.length < 2);
                 });
    if (miss.length) {
      CUR = miss[0].i; drawQ();
      warn(miss.length + "문항이 아직 비어 있습니다. 이 문항부터 채워 주세요.");
      return;
    }
    sendExam();
  }

  async function sendExam() {
    if (SENT) return;
    SENT = true;
    $("#next").disabled = true;
    $("#next").textContent = "채점 중…";
    var res = null;
    try {
      var r = await sb.rpc(FN.submit, { p_answers: PICK });
      if (r.error) throw r.error;
      res = r.data;
    } catch (e) {
      SENT = false;
      var m = String((e && e.message) || e);
      alert(/JWT|session|401/i.test(m)
        ? "로그인이 풀렸습니다. 새로고침하고 다시 로그인해 주세요. 고르신 답은 저장돼 있습니다."
        : "제출하지 못했습니다. 잠시 뒤 다시 눌러 주세요. 고르신 답은 저장돼 있습니다.");
      return;
    } finally {
      $("#next").disabled = false;
      $("#next").textContent = "다 풀었습니다";
    }
    drop();                                   // 채점까지 끝났으니 임시 저장은 지운다
    drawDone(res);
    try { var s = await sb.rpc(FN.state); if (s.data) ST = s.data; } catch (e) { /* 결과는 이미 보여줬다 */ }
  }

  /* ③ 결과 ------------------------------------------------------- */
  function drawDone(res) {
    var ok = !!res.pass, need = (ST && ST.need) || 90;
    $("#rScore").textContent = BONE ? (res.score + " / " + res.total) : (res.score + "점");
    $("#rScore").className = "big " + (ok ? "ok" : "no");
    $("#rCap").textContent = res.paper + " · " + res.at;

    // 영역별로 몇 개 맞았는지 — 몇 번을 틀렸는지는 알려주지 않는다 (다시 볼 수 있으니)
    var per = {}, order = [];
    QS.forEach(function (q) {
      var a = q.area || "기타";
      if (!(a in per)) { per[a] = 0; order.push(a); }
      per[a]++;
    });
    if (!order.length) { order = Object.keys(res.wrong || {}); order.forEach(function (a) { per[a] = 5; }); }
    var wrong = res.wrong || {}, left = 0;
    $("#rAreas").innerHTML = order.map(function (a) {
      var tot = per[a], bad = wrong[a] || 0, good = tot - bad;
      left += bad;
      var pips = "";
      for (var i = 0; i < tot; i++) pips += '<i class="' + (i < good ? "ok" : "") + '"></i>';
      return '<div><span class="k">' + esc(a) + '</span><span class="pips">' + pips +
             '</span><span class="n">' + good + '/' + tot + '</span></div>';
    }).join("");
    // 왼쪽부터 차례로 나타난다 — 결과를 알기 직전이 가장 집중되는 자리다
    Array.prototype.forEach.call($("#rAreas").children, function (el, i) {
      setTimeout(function () { el.classList.add("in"); }, 120 + i * 260);
    });

    // 「몇 개 더 맞혀야 하나」로 말한다. 틀린 개수를 그대로 부르면 실제보다 많이 남은 것처럼 들린다
    var more = BONE ? Math.max(1, need - res.score)
                    : Math.max(1, Math.ceil((need - res.score) / 5));
    $("#rLead").textContent = ok
      ? (BONE ? "통과하셨습니다. 레벨 과제 2번이 완료됐습니다." : "합격입니다. 수료 조건 하나를 채우셨습니다.")
      : more + "문항만 더 맞히시면 됩니다. 합격선은 " + need + (BONE ? "개입니다." : "점입니다.");
    $("#rAreaNote").textContent = ok
      ? "다시 보시면 더 높은 점수를 남길 수 있습니다. 최고 점수만 기록됩니다."
      : "몇 번을 틀렸는지는 알려 드리지 않습니다. 다시 보실 수 있으니 채워지지 않은 영역을 한 번 더 훑고 오시면 됩니다.";
    $("#again").textContent = ok ? "다시 보기 (점수 올리기)" : "다시 보기";
    show("done");
    window.scrollTo(0, 0);
  }

  /* 들어오기 ------------------------------------------------------ */
  function gate(msg, retry) {
    $("#gateMsg").hidden = false;
    $("#gateMsg").innerHTML = msg;
    $("#gateRetry").hidden = !retry;
    show("gate");
  }

  async function boot() {
    try {
      var s = await window.HB.session();
      if (!s) {
        $("#gateMsg").hidden = true;
        $("#gateRetry").hidden = true;
        window.HB.mountAuth($("#authBox"), function () { location.reload(); },
          { lead: "결제하신 계정으로 로그인하세요. 수업일지·강의실과 같은 계정입니다." });
        return;
      }
      $("#logout").hidden = false;
      $("#who").hidden = false;
      $("#who").textContent = s.user.email || "";
      $("#logout").onclick = async function (e) {
        e.preventDefault(); await sb.auth.signOut(); location.reload();
      };

      var r = await sb.rpc(FN.state);
      if (r.error) return gate("연결이 좋지 않습니다. 잠시 뒤 다시 시도해 주세요.", true);
      if (!r.data || !r.data.ok) {
        return gate(r.data && r.data.why === "not-enrolled"
          ? '등록된 과정이 없습니다. <a href="../">과정 안내</a>를 봐 주세요.'
          : "지금은 열어볼 수 없습니다. 잠시 뒤 다시 시도해 주세요.", true);
      }
      ST = r.data;
      drawIntro();
    } catch (e) {
      gate("연결이 끊겼습니다. 다시 시도해 주세요.", true);
    }
  }

  $("#start").onclick = startExam;
  $("#prev").onclick = go(-1);
  $("#next").onclick = go(1);
  $("#again").onclick = function () { drawIntro(); window.scrollTo(0, 0); };
  $("#retry").onclick = function () { gate("확인하는 중…", false); boot(); };
  boot();
})();
</script>
</body>
</html>
