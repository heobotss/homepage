<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마이 페이지 — 허봇스</title>
<meta name="description" content="허봇스에서 받은 것, 산 것, 바로 열 수 있는 것을 한 화면에서 봅니다.">
<meta name="robots" content="noindex,follow">
<link rel="icon" href="../favicon.png" type="image/png">
<style>
/* 내 프로필 화면(/me/) 새 디자인 — 11-10. 생김새만 바꾼다(가입 화면 join.css 와 같은 결).
   교체 때 site\me\index.html 의 첫 스타일 블록을 이 내용으로 갈아 끼운다(_합치기_교체.py 「옷」 단계). 선택자·id·[hidden] 은 옛 것 그대로.
   로그인 전에는 vod/auth.js 가 그리는 로그인 상자(.card.auth · h2 · .note · 비밀번호 칸)가 나온다 — 그것도 여기서 입힌다 */
@font-face{font-family:'Pretend';font-style:normal;font-weight:400;font-display:swap;src:url('../fonts/pretendard-400.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-style:normal;font-weight:500;font-display:swap;src:url('../fonts/pretendard-500.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-style:normal;font-weight:700;font-display:swap;src:url('../fonts/pretendard-700.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-style:normal;font-weight:900;font-display:swap;src:url('../fonts/pretendard-900.woff2') format('woff2')}
:root{color-scheme:dark;
  /* 이름은 옛 것 그대로(화면 안 style 속성이 var(--warm) 등을 쓴다), 값만 새 길의 색 */
  --ink:#070D19;--ink-2:#111A2C;--ink-3:#0C0C0E;--bone:#F2F0EB;--bone-2:#C3CBD8;--warm:#9FABBD;
  --line:#24324A;--line-2:rgba(242,240,235,.16);--blue:#5B8FFA;--good:#5FBF8A;--bad:#E07A6B;--kakao:#FEE500;
  --sans:"Pretend","Pretendard","Apple SD Gothic Neo",-apple-system,system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{position:relative;margin:0;min-height:100vh;background:var(--ink);color:var(--bone);font-family:var(--sans);font-size:16px;line-height:1.7;word-break:keep-all;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 520px at 50% -120px,rgba(91,143,250,.20),transparent 70%),radial-gradient(600px 400px at 100% 30%,rgba(91,143,250,.07),transparent 70%)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(242,240,235,.10) 1px,transparent 1.2px);background-size:28px 28px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%)}
body>*{position:relative;z-index:1}
a{color:var(--bone);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
[hidden]{display:none!important}
/* 옛 머리(교체 때 새 메뉴바로 바뀐다. 바뀌기 전에도 같은 결로 보이게) */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;min-height:64px;padding:0 clamp(16px,4vw,32px);background:rgba(7,13,25,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--bone);text-decoration:none}
.logo small{display:none}
.top nav a{color:var(--warm);text-decoration:none;font-size:15px;min-height:44px;display:inline-flex;align-items:center}
.top nav{display:flex;align-items:center;gap:16px;font-size:14px;color:var(--warm)}
#who{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:600px;margin:0 auto;padding:clamp(48px,9vw,88px) 16px 80px}
h1{font-size:clamp(32px,6vw,48px);font-weight:900;line-height:1.16;letter-spacing:-.04em;margin:0 0 16px}
.lead{color:var(--bone-2);margin:0 0 32px;font-size:17px;line-height:1.7}
.card{padding:32px;border:1px solid var(--line-2);border-radius:24px;background:rgba(242,240,235,.03);
  box-shadow:inset 0 1px 0 rgba(242,240,235,.06),0 24px 64px rgba(0,0,0,.45)}
@media (max-width:520px){.card{padding:24px 16px;border-radius:20px}}
.card h2{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:0 0 12px}
.note{color:var(--warm);font-size:14px;line-height:1.7}
.note a{color:var(--bone-2)}
label{display:block;margin-top:24px;font-size:15px;font-weight:500;color:var(--bone-2)}
label:first-of-type{margin-top:0}
.auth label{margin:18px 0 8px}
label .k{display:block;margin-bottom:6px;color:var(--bone);font-weight:700}
label .why{display:block;color:var(--warm);font-size:13px;font-weight:400;line-height:1.65;margin-bottom:10px}
.mine{display:flex;align-items:center;gap:12px;margin:0 0 20px;color:var(--bone-2);font-size:15px}
.mine img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--ink-3);border:1px solid var(--line-2)}
input[type=text],input[type=email],input[type=tel],input[type=password]{width:100%;min-height:54px;background:var(--ink-3);border:1px solid var(--line-2);border-radius:14px;
  color:var(--bone);font:inherit;font-size:16px;padding:12px 16px;outline:none;box-shadow:inset 0 1px 2px rgba(0,0,0,.5);transition:border-color .2s,box-shadow .2s}
input::placeholder{color:#62625E}
input:focus{border-color:var(--blue);box-shadow:inset 0 1px 2px rgba(0,0,0,.5),0 0 0 4px rgba(91,143,250,.16)}
input:disabled{color:var(--warm);opacity:.8}
.pre{display:flex;align-items:stretch}
.pre span{display:flex;align-items:center;background:var(--ink-3);border:1px solid var(--line-2);border-right:0;border-radius:14px 0 0 14px;padding:0 10px 0 16px;color:var(--warm);min-height:54px}
.pre input{border-radius:0 14px 14px 0}
.chk{display:flex;gap:12px;align-items:flex-start;margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
.chk input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--blue)}
.chk label{color:var(--bone-2)}
.chk .why{color:var(--warm);font-size:13px;display:block;margin-top:2px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:60px;margin-top:28px;border:0;border-radius:999px;
  padding:16px 28px;background:var(--blue);color:#070D19;font-weight:700;font-size:17.5px;letter-spacing:-.01em;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 36px rgba(91,143,250,.35);transition:background-color .2s,box-shadow .2s,transform .2s}
.btn:hover{background:#8FB4FF;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 16px 48px rgba(91,143,250,.5);transform:translateY(-1px)}
.btn[disabled],.btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none;transform:none}
#aKk{min-height:56px;border-radius:999px!important}
.msg{margin-top:14px;font-size:15px;min-height:1.6em;color:var(--bad)}
.msg.ok{color:var(--good)}
.msg.no{color:var(--bad)}
.tail{color:var(--warm);font-size:14px;margin-top:20px}
footer{position:relative;z-index:1;border-top:1px solid var(--line);padding:28px clamp(16px,4vw,40px);color:var(--warm);font-size:13px;line-height:1.9;text-align:center}
footer a{color:var(--bone-2)}
@media (prefers-reduced-motion:reduce){.btn,.btn:hover{transition:none;transform:none}}

/* 11-10 체크박스 한 벌 — 새 화면과 같은 꼴(얇은 테두리, 고르면 파랑) */
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:20px;height:20px;flex:0 0 20px;margin-top:2px;border:1.5px solid rgba(242,240,235,.38);border-radius:6px;background:transparent;display:inline-grid;place-content:center;cursor:pointer;transition:background-color .15s,border-color .15s}
input[type=checkbox]::before{content:"";width:10px;height:5px;border-left:2px solid #070D19;border-bottom:2px solid #070D19;transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .15s}
input[type=checkbox]:checked{background:#5B8FFA;border-color:#5B8FFA}
input[type=checkbox]:checked::before{transform:translateY(-1px) rotate(-45deg) scale(1)}
input[type=checkbox]:disabled{opacity:.4;cursor:default}
input[type=checkbox]:focus-visible{outline:2px solid #5B8FFA;outline-offset:2px}
/* ══ 11-22 안쪽 디테일(시안 라) ── 첫 화면 묶음(n/common.css 끝 블록)과 같은 손질을 안쪽 화면에: 빛은 왼쪽 위 한 방향 · 카드에 층 · 단추 번짐 없음. 글자·순서·id는 그대로 ══ */
:root{--ink:#070D19;--ink-2:#111A2C;--ink-3:#18243C;--bone:#F2F0EB;--bone-2:#C3CBD8;--warm:#9FABBD;--line:#24324A;--line-2:rgba(242,240,235,.16)}
/* 바탕 빛은 화면 전체(html)에 건다 — 짧은 화면에서 본문 아래가 따로 끊겨 보이지 않게 */
html{min-height:100%;background:radial-gradient(900px 620px at 16% -4%,rgba(91,143,250,.17),transparent 62%),radial-gradient(760px 540px at 100% 100%,rgba(255,86,48,.045),transparent 65%),linear-gradient(180deg,#0A1424 0%,#060B15 100%)!important;background-color:#060B15!important}
body{background:none!important}
/* 카드: 위에서 빛 받는 판, 테두리는 빛 받는 쪽만 밝게. 이름이 같은 단추(a.buy)·글줄(p.what)에 묻지 않게 태그를 붙여 고른다 */
.card,section.gate,div.gate,div.buy,section.member,section.hb-lock,section.taste,#box,div.what,div.make,div.cards:not(:has(.card)){border:1px solid transparent!important;background:linear-gradient(180deg,#18243C 0%,#111A2C 42%) padding-box,linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.05) 38%,rgba(255,255,255,.02) 70%) border-box!important;box-shadow:0 28px 56px -28px rgba(0,0,0,.7)!important}
/* 판 안의 판은 겹치지 않게 */
.gate .card,.card .card,div.buy .card,#box .card,.card .gate{background:none!important;border:0!important;box-shadow:none!important}
/* 결제 화면의 고른 상품 판만 파란 테두리(빛 받는 쪽이 진하게) */
#prodCard.card{background:linear-gradient(180deg,#1B2944 0%,#121C30 46%) padding-box,linear-gradient(135deg,rgba(91,143,250,.8),rgba(91,143,250,.22) 45%,rgba(91,143,250,.08) 75%) border-box!important}
/* 작은 칸은 한 단 조용하게: 면 하나, 윗선만 살짝 */
.learn li,.scene p,.bundle ol{background:#111A2C!important;border-color:#24324A!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
/* 단추: 아래 색 번짐을 빼고 윗면 빛만 */
.btn{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 2px rgba(0,0,0,.4)!important}
.btn:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 2px rgba(0,0,0,.4)!important}
.btn.line,.btn.sub,.btn.soon,.btn[disabled],.btn:disabled{box-shadow:none!important}
.pv .play{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 6px rgba(0,0,0,.5)!important}
/* 판 안의 글 칸은 판보다 한 단 깊게(눌린 칸) */
:is(.card,.gate,#box,div.buy) :is(input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=url],input[type=search],textarea,select){background-color:#0B1322!important;border-color:#2B3A55!important}
/* 아이폰: 글 칸 글자가 16px보다 작으면 누를 때 화면이 저절로 확대된다 → 아이폰에서만 16px 이상으로 */
@supports (-webkit-touch-callout:none){input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=hidden]),select,textarea{font-size:max(16px,1em)!important}}
/* 로그인 상자 공통: 안내 글이 따로 띠·상자로 보이거나 로그인 단추만 작게 나오던 화면(재등록 도구 등)을 다른 화면과 같게 */
.card.auth .note{border:0!important;background:none!important;padding:0!important;border-radius:0!important}
.card.auth>.btn{display:flex!important;width:100%;justify-content:center;margin-top:14px}
/* 무료 자료 화면에서 열쇠 없이 들어왔을 때 뜨는 로그인 칸: 꾸밈이 빠져 글자가 가장자리에 붙고 칸이 한 줄에 뭉치던 것 */
#lockAuth .card.auth{margin-top:16px;padding:20px!important}
#lockAuth .auth h2{margin:0 0 6px;font-size:1.0625rem}
#lockAuth .auth label{display:block;font-size:.9375rem;margin:12px 0 6px}
#lockAuth .auth input{display:block;width:100%;border:1px solid #2B3A55;border-radius:14px;color:inherit;font:inherit;padding:12px 14px;outline:none}
#lockAuth .auth .note{font-size:.8125rem;line-height:1.7}
/* 카카오 단추 모양을 화면마다 같게(둥근 알약) */
.card.auth #aKk{border-radius:999px!important}
/* ATC 내 과정·관리 화면의 #gate 는 카드가 아니라 자리 잡는 틀이다 — 카드 규칙이 걸려 글자가 테두리에 붙던 것을 되돌린다 */
div#gate.gate{background:none!important;border:0!important;box-shadow:none!important}
/* 강의실 구매 단추: 아래로 번지던 파란 빛 제거(다른 단추와 같게) */
a.buy{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 2px rgba(0,0,0,.4)!important}
/* 파일 고르는 단추가 브라우저 기본 회색으로 나오던 것 */
input[type=file]{color:#C3CBD8;font:inherit;max-width:100%}
input[type=file]::file-selector-button{background:#18243C;color:#F2F0EB;border:1px solid #2B3A55;border-radius:999px;padding:7px 14px;margin-right:10px;font:inherit;font-weight:600;cursor:pointer}
/* ── 11-28 줄바꿈 ── 한두 낱말만 다음 줄로 떨어지지 않게 줄 길이를 고르게 맞춘다(지원 안 하는 브라우저는 예전 그대로). 표는 휴대폰에서도 낱말 가운데를 끊지 않는다 */
body{text-wrap:balance}
h1,h2,h3,h4,p,li,dd,dt,td,th,label,small,figcaption,blockquote,summary{text-wrap-style:balance}
@media (max-width:640px){th,td{word-break:keep-all!important;overflow-wrap:anywhere}}
/* 안쪽 디테일 끝 */
</style>
<style id="hb-bar-css">.hb-bar{position:sticky;top:0;z-index:50;height:64px;background:rgba(7,13,25,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #24324A;font-family:"P","Pretend",system-ui,-apple-system,"Malgun Gothic",sans-serif}.hb-bar .hb-in{max-width:1312px;height:100%;margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}.hb-bar a{color:#9FABBD;text-decoration:none}.hb-bar .hb-logo{color:#F2F0EB;font-size:20px;font-weight:800;letter-spacing:-.02em;min-height:44px;display:inline-flex;align-items:center}.hb-bar nav{display:flex;align-items:center;gap:16px;font-size:16px}.hb-bar nav a{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}.hb-bar nav a:hover{color:#F2F0EB}.hb-bar nav a.hb-me{color:#F2F0EB;border:1px solid rgba(242,240,235,.18);border-radius:999px;padding:0 16px}.hb-bar .hb-keep{display:flex;gap:12px;align-items:center;font-size:14px;color:#9FABBD}.hb-bar .hb-keep:empty{display:none}@media (max-width:720px){.hb-bar .hb-in{padding:0 16px}.hb-bar nav{gap:2px;font-size:13px}.hb-bar nav{overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 auto;justify-content:flex-start}.hb-bar nav::-webkit-scrollbar{display:none}.hb-bar .hb-in{gap:8px}.hb-bar nav a{flex:none;min-width:0;padding:0 4px}.hb-bar nav a.hb-me{padding:0 10px;margin-left:2px}.hb-bar .hb-logo{flex:none;white-space:nowrap}.hb-bar .hb-keep{display:none}}@media (max-width:400px){.hb-bar nav{font-size:12px}.hb-bar nav a{padding:0 3px}.hb-bar nav a.hb-me{padding:0 9px}}@media (max-width:359px){.hb-bar nav{mask-image:linear-gradient(90deg,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent)}}</style>
<style id="my-css">
/* ══ 마이 페이지(/my/) 11-27 ── 받은 것·산 것·바로 열 수 있는 것을 한 화면에. 이름은 전부 m- 로 시작(프로필 화면에서 물려받은 .card·.btn 과 안 부딪히게) ══ */
@font-face{font-family:'Bahn';font-style:normal;font-weight:700;font-display:swap;src:url('../fonts/bahn-700.woff2') format('woff2')}
#my{max-width:1080px;padding:clamp(28px,5vw,48px) 24px 90px;--c:#111A2C;--t:#18243C;--ln:#24324A;--gv:#0A1220;--gl:#1C2840;--i:#F2F0EB;--i2:#9FABBD;--b:#5B8FFA;--b2:#8FB4FF;line-height:1.5;letter-spacing:-.01em}
#authWrap{max-width:600px;margin:0 auto}
#my .num{font-family:'Bahn','Pretend',sans-serif;letter-spacing:0}
.m-load{color:var(--i2);padding:40px 0}
.m-eye{font-size:13.5px;color:var(--b2);font-weight:700;margin:0}
#my h1.m-h1{font-size:28px;font-weight:900;line-height:1.35;margin:8px 0 0;letter-spacing:-.03em;word-break:keep-all}
.m-h1 b{color:var(--b2);font-weight:900}
.m-lab{font-size:13.5px;color:var(--i2);font-weight:500;margin:0}
.m-pn{background:linear-gradient(180deg,var(--t),var(--c) 46%);border:1px solid var(--ln);border-radius:18px;padding:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.m-hero{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
.m-hero.one{grid-template-columns:1fr}
.m-hero h3{font-size:21px;font-weight:700;margin:8px 0 0;line-height:1.4;word-break:keep-all}
.m-hero p.t{font-size:14.5px;color:var(--i2);margin:8px 0 0;line-height:1.6;word-break:keep-all}
a.m-b,button.m-b{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:12px;font-weight:700;font-size:15.5px;background:linear-gradient(180deg,#6A9BFF,#5B8FFA 60%,#4A7BEC);color:#06101F;margin-top:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.3);text-decoration:none;border:0;cursor:pointer;font-family:inherit}
a.m-b.g,button.m-b.g{background:none;color:var(--i);box-shadow:inset 0 0 0 1px #33435E}
a.m-b:hover{filter:brightness(1.08)}
/* 칸 띠 */
.m-strip{margin-top:16px}
.m-sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.m-sh .cnt{font-size:15px;color:var(--i2);margin:0}
.m-sh .cnt b{font-size:34px;color:var(--i);margin-right:4px}
.m-sh .cnt b.o{font-size:22px;color:var(--b2)}
.m-lg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--i2)}
.m-lg span{display:inline-flex;align-items:center;gap:7px}
.m-cells{display:flex;gap:14px;margin-top:16px}
.m-cg{flex:1;min-width:0}
.m-cg .row{display:flex;gap:4px}
.m-cg p{font-size:13px;color:var(--i2);margin:9px 0 0}
.m-cg p b{color:var(--i);font-weight:700}
.m-c{flex:1;height:28px;border-radius:6px;max-width:64px}
