<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>결제 실패 — 허봇스</title>
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="pay.css">
</head>
<body>
<header class="top">
  <a class="logo" href="../">허봇스<small>HEOBOTSS</small></a>
</header>
<main>
  <div class="done-icon bad">!</div>
  <h1>결제가 완료되지 않았습니다</h1>
  <p class="sub" id="msg">결제창에서 취소됐거나 승인이 거절됐습니다.</p>
  <p class="note">돈은 빠져나가지 않았습니다. 다른 카드나 결제 수단으로 다시 시도해 주세요.</p>
  <p style="margin-top:22px"><a class="btn line" id="retry" href="index.html">다시 시도</a></p>
  <footer class="legal" id="legal"></footer>
</main>
<script>
const q = new URLSearchParams(location.search);
const code = q.get("code") || "", message = q.get("message") || "";
if (message) document.getElementById("msg").textContent = message + (code ? " (" + code + ")" : "");
try { const o = JSON.parse(sessionStorage.getItem("hb_order") || "null"); } catch {}
fetch("../policy/legal.txt").then(r => r.ok ? r.text() : "").then(t => { if (t) document.getElementById("legal").innerHTML = t; }).catch(() => {});
</script>
</body>
</html>
