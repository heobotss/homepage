<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>결제 확인 — 허봇스</title>
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="pay.css">
</head>
<body>
<header class="top">
  <a class="logo" href="../">허봇스<small>HEOBOTSS</small></a>
</header>
<main>
  <div id="wait">
    <h1><span class="spin"></span>결제를 확인하는 중입니다</h1>
    <p class="sub">창을 닫지 말고 잠시 기다려 주세요.</p>
  </div>

  <div id="ok" hidden>
    <div class="done-icon">✓</div>
    <h1 id="okTitle">등록이 완료됐습니다</h1>
    <p class="sub" id="okSub">확인 메일을 보냈습니다. 날짜·장소가 확정되면 같은 메일로 안내드립니다.</p>
    <section class="card">
      <h2>주문 내역</h2>
      <table class="kv" id="kv"></table>
    </section>
    <a class="btn line" id="receipt" href="#" target="_blank" rel="noopener" hidden>영수증 보기</a>
    <p class="note">문의는 홈페이지 하단 연락처로 주세요. 주문번호를 함께 알려 주시면 빠릅니다.</p>
    <p style="margin-top:22px"><a href="../">홈으로</a></p>
  </div>

  <div id="bad" hidden>
    <div class="done-icon bad">!</div>
    <h1>결제를 확정하지 못했습니다</h1>
    <p class="sub" id="badMsg"></p>
    <p class="note">카드 승인이 났더라도 확정되지 않은 결제는 자동으로 취소됩니다. 다시 시도하거나 문의 주세요.</p>
    <p style="margin-top:22px"><a class="btn line" href="index.html">다시 시도</a></p>
  </div>

  <footer class="legal" id="legal"></footer>
</main>

<script>
const SB_URL = "https://kpubgeejyiupdvbbdxwt.supabase.co";
const SB_KEY = "sb_publishable_09UkwFHF2-tqRQexECgFUw_eyrPlCvD";
const $ = (s) => document.querySelector(s);
const won = (n) => n.toLocaleString("ko-KR") + "원";
const kst = (d) => d ? new Date(d).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", dateStyle: "long", timeStyle: "short" }) : "날짜 확정 전 · 확정되면 메일로 안내";
fetch("../policy/legal.txt").then(r => r.ok ? r.text() : "").then(t => { if (t) $("#legal").innerHTML = t; }).catch(() => {});

(async () => {
  const q = new URLSearchParams(location.search);
  const paymentKey = q.get("paymentKey"), orderId = q.get("orderId"), amount = Number(q.get("amount"));
  const show = (id) => { for (const k of ["wait", "ok", "bad"]) $("#" + k).hidden = k !== id; };
  if (!paymentKey || !orderId || !amount) { $("#badMsg").textContent = "결제 정보가 없습니다."; return show("bad"); }
  try {
    const r = await fetch(SB_URL + "/functions/v1/pay-confirm", { method: "POST", headers: { "Content-Type": "application/json", apikey: SB_KEY, Authorization: "Bearer " + SB_KEY },
      body: JSON.stringify({ paymentKey, orderId, amount }) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.message || "승인 실패");
    const o = d.order;
    const waiting = o.status === "waiting_deposit";
    if (waiting) {
      $("#okTitle").textContent = "입금 계좌를 안내드립니다";
      $("#okSub").textContent = "아래 계좌로 기한 안에 입금하시면 등록이 확정되고 확인 메일이 갑니다.";
    }
    const rows = [["주문번호", o.orderId], ["상품", o.orderName], ["금액", '<span class="amt">' + won(o.amount) + "</span>"], ["결제수단", o.method || "-"],
      ["일시", kst(o.startsAt)], ["장소", o.place || "확정 후 안내"], ["신청자", o.buyerName + " · " + o.buyerEmail]];
    if (waiting && o.virtualAccount) rows.push(["입금 계좌", (o.virtualAccount.bankCode || "") + " " + (o.virtualAccount.accountNumber || "") + "<br>예금주 " + (o.virtualAccount.customerName || "") + " · 기한 " + kst(o.virtualAccount.dueDate)]);
    $("#kv").innerHTML = rows.map(([k, v]) => "<tr><td>" + k + "</td><td>" + v + "</td></tr>").join("");
    if (o.receiptUrl) { $("#receipt").href = o.receiptUrl; $("#receipt").hidden = false; }
    sessionStorage.removeItem("hb_order");
    history.replaceState(null, "", location.pathname);   // 새로고침해도 승인 요청이 다시 안 가게
    show("ok");
  } catch (e) {
    $("#badMsg").textContent = e.message || String(e);
    show("bad");
  }
})();
</script>
</body>
</html>
