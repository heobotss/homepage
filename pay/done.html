<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>결제 확인 — 허봇스</title>
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="pay.css">
</head>
<body>
<header class="top">
  <a class="logo" href="../">허봇스<small>HEOBOTSS</small></a>
</header>
<main>
  <div id="testBar" hidden style="background:#161616;border:1px solid #333333;color:#EDEDED;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:18px"><b>테스트 결제</b>입니다. 실제로 돈이 빠져나가지 않았고, 정식 등록도 아닙니다.</div>
  <div id="wait">
    <h1><span class="spin"></span>결제를 확인하는 중입니다</h1>
    <p class="sub">창을 닫지 말고 잠시 기다려 주세요.</p>
  </div>

  <div id="ok" hidden>
    <div class="done-icon">✓</div>
    <h1 id="okTitle">등록이 완료됐습니다</h1>
    <p class="sub" id="okSub">확인 메일을 보냈습니다. 날짜·장소가 확정되면 같은 메일로 안내드립니다.</p>
    <section class="card">
      <h2>주문 내역</h2>
      <table class="kv" id="kv"></table>
    </section>
    <a class="btn line" id="receipt" href="#" target="_blank" rel="noopener" hidden>영수증 보기</a>
    <p class="note">문의는 홈페이지 하단 연락처로 주세요. 주문번호를 함께 알려 주시면 빠릅니다.</p>
    <p style="margin-top:22px"><a href="../">홈으로</a></p>
  </div>

  <div id="bad" hidden>
    <div class="done-icon bad">!</div>
    <h1>결제를 확정하지 못했습니다</h1>
    <p class="sub" id="badMsg"></p>
    <p class="note">카드 승인이 났더라도 확정되지 않은 결제는 자동으로 취소됩니다. 다시 시도하거나 문의 주세요.</p>
    <p style="margin-top:22px"><a class="btn line" href="index.html">다시 시도</a></p>
  </div>

  <footer class="legal" id="legal"></footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="../vod/auth.js"></script>
<script>
const SB_URL = "https://kpubgeejyiupdvbbdxwt.supabase.co";
const SB_KEY = "sb_publishable_09UkwFHF2-tqRQexECgFUw_eyrPlCvD";
const $ = (s) => document.querySelector(s);
const won = (n) => n.toLocaleString("ko-KR") + "원";
const kst = (d) => d ? new Date(d).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", dateStyle: "long", timeStyle: "short" }) : "날짜 확정 전 · 확정되면 메일로 안내";
fetch("../policy/legal.txt").then(r => r.ok ? r.text() : "").then(t => { if (t) $("#legal").innerHTML = t; }).catch(() => {});

(async () => {
  const q = new URLSearchParams(location.search);
  const paymentKey = q.get("paymentKey"), orderId = q.get("orderId"), amount = Number(q.get("amount"));
  const show = (id) => { for (const k of ["wait", "ok", "bad"]) $("#" + k).hidden = k !== id; };

  /* 구독(자동결제) 카드 등록을 마치고 돌아온 길 (2026-10-14) */
  const subId = q.get("sub"), authKey = q.get("authKey"), customerKey = q.get("customerKey");
  if (subId && authKey && customerKey) {
    try {
      const ses = await HB.session();
      if (!ses) throw new Error("로그인이 풀렸습니다. 다시 로그인한 뒤 등록해 주세요.");
      const r0 = await fetch(SB_URL + "/functions/v1/billing-register", {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: SB_KEY, Authorization: "Bearer " + ses.access_token },
        body: JSON.stringify({ authKey, customerKey, productId: subId }),
      });
      const d0 = await r0.json();
      if (!d0.ok) throw new Error(d0.message || "구독을 시작하지 못했습니다");
      $("#okTitle").textContent = d0.replaced ? "카드를 바꿨습니다" : d0.resumed ? "결제가 다시 이어졌습니다" : "구독이 시작됐습니다";
      $("#okSub").textContent = d0.replaced
        ? "다음 결제일부터 새 카드로 결제됩니다."
        : "바로 쓰실 수 있습니다. 확인 메일도 보냈습니다.";
      $("#kv").innerHTML = [
        d0.orderId ? ["주문번호", d0.orderId] : null,
        ["결제 금액", '<span class="amt">' + won(d0.amount) + "</span>"],
        ["다음 결제일", new Date(d0.nextChargeAt).toLocaleDateString("ko-KR", { timeZone: "Asia/Seoul", dateStyle: "long" })],
        ["해지", '<a href="my.html">내 구독 화면</a>에서 언제든 · 다음 결제부터 멈춥니다'],
      ].filter(Boolean).map(([k, v]) => "<tr><td>" + k + "</td><td>" + v + "</td></tr>").join("");
      history.replaceState(null, "", location.pathname);
      return show("ok");
    } catch (e) {
      $("#badMsg").textContent = e.message || String(e);
      return show("bad");
    }
  }
  if (!paymentKey || !orderId || !amount) { $("#badMsg").textContent = "결제 정보가 없습니다."; return show("bad"); }
  try {
    const r = await fetch(SB_URL + "/functions/v1/pay-confirm", { method: "POST", headers: { "Content-Type": "application/json", apikey: SB_KEY, Authorization: "Bearer " + SB_KEY },
      body: JSON.stringify({ paymentKey, orderId, amount }) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.message || "승인 실패");
    const o = d.order;
    if (d.test) $("#testBar").hidden = false;
    const waiting = o.status === "waiting_deposit";
    if (waiting) {
      $("#okTitle").textContent = "입금 계좌를 안내드립니다";
      $("#okSub").textContent = "아래 계좌로 기한 안에 입금하시면 등록이 확정되고 확인 메일이 갑니다.";
    }
    const vod = o.kind === "vod", app = o.kind === "app", course = o.kind === "course", sub = o.kind === "sub";
    const simple = vod || app || course || sub;   /* 세미나가 아니면 일시·장소 줄을 보이지 않는다 */
    const rows = simple
      ? [["주문번호", o.orderId], ["강의", o.orderName], ["금액", '<span class="amt">' + won(o.amount) + "</span>"], ["결제수단", o.method || "-"], ["열람", "오늘부터 " + (o.accessDays || 365) + "일"], ["계정", o.buyerEmail]]
      : [["주문번호", o.orderId], ["상품", o.orderName], ["금액", '<span class="amt">' + won(o.amount) + "</span>"], ["결제수단", o.method || "-"],
      ["일시", kst(o.startsAt)], ["장소", o.place || "확정 후 안내"], ["신청자", o.buyerName + " · " + o.buyerEmail]];
    /* 10-14 — 결제 뒤 첫 버튼은 항상 「다음 행동」. 수업일지·ATC 결제자가 세미나 문구를 보던 것을 고친다 */
    if (app) {
      $("#okTitle").textContent = "이용권이 적용됐습니다";
      $("#okSub").textContent = "수업일지에서 바로 기록하실 수 있습니다. 확인 메일도 보냈습니다.";
      const go = document.createElement("a"); go.className = "btn"; go.href = "https://app.heobotss.com/"; go.textContent = "수업일지 열기"; go.style.marginBottom = "14px";
      $("#receipt").before(go);
    }
    if (course) {
      $("#okTitle").textContent = "등록이 완료됐습니다";
      $("#okSub").textContent = "1일차 과제부터 시작하시면 됩니다. 확인 메일도 보냈습니다.";
      const go = document.createElement("a"); go.className = "btn"; go.href = "../atc/my/"; go.textContent = "1일차 과제 보기"; go.style.marginBottom = "14px";
      $("#receipt").before(go);
    }
    if (vod) {
      $("#okTitle").textContent = "구매가 완료됐습니다";
      $("#okSub").textContent = "강의실에서 바로 보실 수 있습니다. 확인 메일도 보냈습니다.";
      const go = document.createElement("a"); go.className = "btn"; go.href = "../vod/?c=" + (o.productId || ""); go.textContent = "강의실 열기";
      try {   /* 첫 강의로 바로 — 묶음이면 covers 첫 과목 */
        const pr = await (await fetch(SB_URL + "/rest/v1/pay_products?id=eq." + encodeURIComponent(o.productId || "") + "&select=covers", { headers: { apikey: SB_KEY } })).json();
        const first = (pr[0] && pr[0].covers && pr[0].covers[0]) || o.productId;
        const vv = await (await fetch(SB_URL + "/rest/v1/vod_videos?product_id=eq." + encodeURIComponent(first) + "&select=title,length_sec,ord&order=ord&limit=1", { headers: { apikey: SB_KEY } })).json();
        if (vv[0]) { go.href = "../vod/?c=" + encodeURIComponent(first) + "&t=" + encodeURIComponent(vv[0].title); go.textContent = "첫 강의 바로 보기 — 1편 〈" + vv[0].title + "〉 " + Math.max(1, Math.round((vv[0].length_sec || 0) / 60)) + "분"; }
      } catch (e) {}
      try { const s2 = await HB.session(); const prov = s2 && s2.user && s2.user.app_metadata && s2.user.app_metadata.provider;
        if (prov === "kakao") $("#okSub").textContent += " 카카오로 가입하셨으니 다른 기기에서도 비밀번호 없이 「카카오로 계속하기」로 열립니다."; } catch (e) {} go.style.marginBottom = "10px";
      $("#receipt").before(go);
    }
    if (waiting && o.virtualAccount) rows.push(["입금 계좌", (o.virtualAccount.bankCode || "") + " " + (o.virtualAccount.accountNumber || "") + "<br>예금주 " + (o.virtualAccount.customerName || "") + " · 기한 " + kst(o.virtualAccount.dueDate)]);
    $("#kv").innerHTML = rows.map(([k, v]) => "<tr><td>" + k + "</td><td>" + v + "</td></tr>").join("");
    if (o.receiptUrl) { $("#receipt").href = o.receiptUrl; $("#receipt").hidden = false; }
    try { window.HBT && HBT.event("paid", "pay:" + (o.productId || "")); } catch (e) {}
    sessionStorage.removeItem("hb_order");
    history.replaceState(null, "", location.pathname);   // 새로고침해도 승인 요청이 다시 안 가게
    show("ok");
  } catch (e) {
    $("#badMsg").textContent = e.message || String(e);
    show("bad");
  }
})();
</script>
<script src="../t.js"></script>
</body>
</html>
