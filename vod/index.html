<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>강의실 — 허봇스</title>
<link rel="icon" href="../favicon.png">
<link rel="stylesheet" href="../pay/pay.css">
<style>
/* 강의실 화면(/vod/) 새 디자인 — 11-10. 생김새만 바꾼다. 스크립트·id·클래스·글자는 그대로.
   바탕 규칙과 색 이름은 ../pay/pay.css(교체 때 새 2판으로 바뀜 — brass·sage 가 파랑, brass-lt 가 밝은 글자)에서 온다.
   교체 때 site\vod\index.html 의 첫 스타일 블록을 이 내용으로 갈아 끼운다(_합치기_교체.py 「옷」 단계) */
main{max-width:1040px}
[hidden]{display:none!important}
.who{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 24px;padding:14px 20px;
  border:1px solid var(--line-2);border-radius:999px;background:rgba(242,240,235,.03)}
.who .me{color:var(--warm);font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%}
.who a{font-size:14px;color:var(--bone-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.course{position:relative;display:flex;flex-direction:column;gap:8px;padding:24px;border:1px solid var(--line-2);border-radius:20px;
  background:linear-gradient(180deg,rgba(26,26,30,.86),rgba(15,15,17,.86));box-shadow:inset 0 1px 0 rgba(242,240,235,.06),0 16px 40px rgba(0,0,0,.35);
  cursor:pointer;text-align:left;color:inherit;font:inherit;transition:border-color .2s,transform .2s,box-shadow .2s}
.course:hover{border-color:rgba(79,134,247,.55);transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(242,240,235,.08),0 20px 48px rgba(79,134,247,.18)}
.course .k{font-size:12.5px;color:var(--sage);letter-spacing:.04em;font-weight:500}
.course .t{font-weight:800;font-size:19px;line-height:1.35;letter-spacing:-.02em}
.course .d{font-size:14px;color:var(--warm);line-height:1.6}
.course .s{font-size:13px;color:var(--sage);margin-top:auto;padding-top:8px;font-variant-numeric:tabular-nums}
.course.locked{cursor:default;background:rgba(242,240,235,.02);box-shadow:none}
.course.locked:hover{transform:none;border-color:rgba(242,240,235,.28);box-shadow:none}
.course.locked .s{color:var(--bone-2)}
.course .buy{margin-top:10px;align-self:flex-start;display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;
  background:var(--brass);color:#0A0A0B;font-size:14.5px;font-weight:700;text-decoration:none;box-shadow:0 8px 24px rgba(79,134,247,.3)}
.course .buy:hover{background:#6B9CFF}
h2.sec{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--warm);letter-spacing:.12em;margin:40px 0 16px;font-weight:500}
h2.sec::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brass);box-shadow:0 0 12px 3px rgba(79,134,247,.6)}
.player{position:relative;background:#000;border-radius:20px;overflow:hidden;aspect-ratio:16/9;max-height:74vh;margin:0 auto;
  border:1px solid var(--line-2);box-shadow:0 24px 64px rgba(0,0,0,.55)}
.player video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
.player .mark{position:absolute;left:8%;top:12%;pointer-events:none;user-select:none;font-size:clamp(11px,1.4vw,15px);color:rgba(255,255,255,.28);text-shadow:0 0 2px rgba(0,0,0,.6);white-space:nowrap;transition:left 1.2s ease,top 1.2s ease}
.player .fs{position:absolute;right:12px;top:12px;border:0;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font:inherit;font-size:13px;padding:8px 14px;cursor:pointer;opacity:.8;backdrop-filter:blur(6px)}
.player .fs:hover{opacity:1}
.player .pstart{position:absolute;inset:0;margin:auto;width:fit-content;height:fit-content;display:flex;align-items:center;gap:12px;border:0;border-radius:999px;background:var(--blue,#4F86F7);color:#fff;font:inherit;font-size:18px;font-weight:800;padding:16px 28px 16px 24px;cursor:pointer;box-shadow:0 10px 40px rgba(79,134,247,.45)}
.player .pstart[hidden]{display:none}
.player .pstart i{width:0;height:0;border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
.player:fullscreen{max-height:none;border-radius:0;border:0}
.ptitle{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:20px 0 4px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 12px}
.tabs button{min-height:44px;border:1px solid var(--line-2);background:rgba(242,240,235,.03);color:var(--bone-2);border-radius:999px;padding:0 18px;font:inherit;font-size:14.5px;cursor:pointer;transition:border-color .2s,background .2s}
.tabs button:hover{border-color:rgba(242,240,235,.32)}
.tabs button.on{background:rgba(79,134,247,.14);border-color:var(--brass);color:var(--bone)}
.list{border:1px solid var(--line-2);border-radius:20px;overflow:hidden;background:rgba(242,240,235,.02)}
.list button{display:flex;width:100%;gap:14px;align-items:center;justify-content:space-between;min-height:56px;padding:14px 20px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--bone);font:inherit;font-size:15.5px;text-align:left;cursor:pointer;transition:background .15s}
.list button:first-child{border-top:0}
.list button:hover{background:rgba(242,240,235,.04)}
.list button.on{background:rgba(79,134,247,.12);color:var(--bone);box-shadow:inset 3px 0 0 var(--brass)}
.list .n{color:var(--warm);font-size:13px;min-width:28px;font-variant-numeric:tabular-nums}
.list .len{color:var(--warm);font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.files button{min-height:44px;border:1px solid var(--line-2);background:rgba(242,240,235,.03);color:var(--bone);border-radius:999px;padding:0 18px;font:inherit;font-size:14px;cursor:pointer;transition:border-color .2s}
.files button:hover{border-color:var(--brass)}
.back{display:inline-block;margin-bottom:16px;font-size:14px;color:var(--bone-2)}
.auth{max-width:460px;margin:0 auto}
.auth h2{font-size:24px;font-weight:800;color:var(--bone);text-transform:none;letter-spacing:-.03em;display:block}
.auth h2::before{display:none}
.auth label{display:block;margin:18px 0 8px;font-size:15px;color:var(--bone-2)}
.auth input{width:100%;min-height:54px;background:var(--ink-3);border:1px solid var(--line-2);border-radius:14px;color:var(--bone);font:inherit;font-size:16px;padding:12px 16px;outline:none;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.auth input:focus{border-color:var(--brass);box-shadow:inset 0 1px 2px rgba(0,0,0,.5),0 0 0 4px rgba(79,134,247,.16)}
#aKk{min-height:56px;border-radius:999px!important}
.muted{color:var(--warm);font-size:14px;line-height:1.7}
@media (max-width:520px){.course{padding:20px}.who{border-radius:16px}.list button{padding:14px 16px}}
@media (prefers-reduced-motion:reduce){.course,.course:hover{transition:none;transform:none}}

/* 11-10 체크박스 한 벌 — 새 화면과 같은 꼴(얇은 테두리, 고르면 파랑) */
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:20px;height:20px;flex:0 0 20px;margin-top:2px;border:1.5px solid rgba(242,240,235,.38);border-radius:6px;background:transparent;display:inline-grid;place-content:center;cursor:pointer;transition:background-color .15s,border-color .15s}
input[type=checkbox]::before{content:"";width:10px;height:5px;border-left:2px solid #0A0A0B;border-bottom:2px solid #0A0A0B;transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .15s}
input[type=checkbox]:checked{background:#4F86F7;border-color:#4F86F7}
input[type=checkbox]:checked::before{transform:translateY(-1px) rotate(-45deg) scale(1)}
input[type=checkbox]:disabled{opacity:.4;cursor:default}
input[type=checkbox]:focus-visible{outline:2px solid #4F86F7;outline-offset:2px}
/* 11-10 로그인 전에는 제목도 로그인 카드와 같은 가운데 단에 — 로그인 뒤(강의 목록)는 넓은 단 그대로 */
@media (min-width:721px){main:has(#app .auth)>h1,main:has(#app .auth)>.sub{max-width:460px;margin-left:auto;margin-right:auto}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>
<script src="auth.js"></script>
<style id="hb-bar-css">.hb-bar{position:sticky;top:0;z-index:50;height:64px;background:rgba(10,10,11,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #242426;font-family:"P","Pretend",system-ui,-apple-system,"Malgun Gothic",sans-serif}.hb-bar .hb-in{max-width:1312px;height:100%;margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}.hb-bar a{color:#ABABA6;text-decoration:none}.hb-bar .hb-logo{color:#F2F0EB;font-size:20px;font-weight:800;letter-spacing:-.02em;min-height:44px;display:inline-flex;align-items:center}.hb-bar nav{display:flex;align-items:center;gap:16px;font-size:16px}.hb-bar nav a{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}.hb-bar nav a:hover{color:#F2F0EB}.hb-bar nav a.hb-me{color:#F2F0EB;border:1px solid rgba(242,240,235,.18);border-radius:999px;padding:0 16px}.hb-bar .hb-keep{display:flex;gap:12px;align-items:center;font-size:14px;color:#ABABA6}.hb-bar .hb-keep:empty{display:none}@media (max-width:720px){.hb-bar .hb-in{padding:0 16px}.hb-bar nav{gap:2px;font-size:13px}.hb-bar nav .hb-wide{display:none}.hb-bar nav a.hb-me{padding:0 12px}.hb-bar .hb-keep{display:none}}</style>
</head>
<body>
<header class="hb-bar"><div class="hb-in"><a class="hb-logo" href="/">허봇스</a><span class="hb-keep"></span><nav aria-label="주 메뉴"><a href="/trainer/#t-check">30초 진단</a><a class="hb-wide" href="/tools/">프로그램</a><a href="/courses/">강의</a><a href="/plan/">가격</a><a class="hb-wide" href="/free/">무료 자료</a><a class="hb-me" href="/vod/">로그인</a></nav></div></header><script>try{if(localStorage.getItem("hb-auth"))document.querySelector(".hb-bar .hb-me").textContent="내 강의실"}catch(e){}</script>
<main>
  <h1>강의실</h1>
  <p class="sub" id="lead">구매한 강의를 12개월 동안 볼 수 있습니다.</p>
  <div id="app"><p class="muted"><span class="spin"></span>불러오는 중</p></div>
  <footer class="legal" id="legal"></footer>
</main>

<script>
(function(){
"use strict";
var sb = HB.sb, esc = HB.esc, FN = HB.SB_URL + "/functions/v1/";
var $app = document.getElementById("app");
fetch("../policy/legal.txt").then(function(r){return r.ok?r.text():"";}).then(function(t){ if(t) document.getElementById("legal").innerHTML=t; }).catch(function(){});

/* 상품 — 가격은 결제 페이지가 서버에서 다시 읽는다. 여기 값은 안내용 */
var COURSES = [
  { id:"vod-4t-member", tag:"트레이너 시스템 강의", name:"4T 회원관리", desc:"개인운동·식단·스케줄·온라인 마케팅", price:89000 },
  { id:"vod-4t-sales",  tag:"트레이너 시스템 강의", name:"4T 세일즈", desc:"재등록·OT&체험수업·회원 소개·상담·인바디", price:109000 },
  { id:"vod-4t-coach",  tag:"트레이너 시스템 강의", name:"4T 운동지도", desc:"정적·동적평가·맞춤 운동·스몰토크·티칭 오류·2:1 PT", price:129000 },
  { id:"vod-4t-consult",  name:"4T 트레이너 상담", desc:"등록으로 잇는 질문 순서·마무리 · 78분 · 바로 쓰는 상담 질문지", price:69000 },
  { id:"vod-4t-sequence", name:"4T 트레이너 시퀀스", desc:"좋아진 것을 숫자로 남기는 수업 틀 · 50분 · 시퀀스 기록 양식", price:59000 },
  { id:"vod-4t-score",    name:"4T 트레이너 점수 체크리스트", desc:"100문항으로 내 점수 재기 · 102분 · 인쇄용 체크시트", price:69000 },
  { id:"vod-4t-years",    name:"4T 연차별 체크리스트", desc:"지금 내 단계와 다음 할 일 · 준비생~5년차 이상 · 58분", price:49000 },
  { id:"vod-anatomy",   name:"4T 실전해부학", desc:"1~3부", price:149000 },
  { id:"vod-mock-exam", name:"4T 모의고사", desc:"문제지 9종(LV0 · VOL1~4 · 영역별 4) + 채점용 정답표 + 레벨별·영역별 해설", price:99000 },
  { id:"vod-startup",   name:"트레이너 창업 (창업 전)", desc:"단독 강의", price:49000 }
];
var BUNDLES = [
  { id:"vod-allpass",   name:"전체 올패스", desc:"위 강의 전부 · 12개월", price:590000 },
  { id:"vod-4t-master", tag:"트레이너 시스템 강의", name:"4T 트레이너 시스템", desc:"4T 회원관리·세일즈·운동지도 15편 · 12개월", price:249000 }
];
var won = function(n){ return n.toLocaleString("ko-KR") + "원"; };
// 11-03: 4T 단품·묶음 카드 이름 위에 「트레이너 시스템 강의」 표시
var kTag = function(c){ return c.tag ? '<span class="k">'+esc(c.tag)+'</span>' : ""; };
var ymd = function(d){ var x=new Date(d); return x.getFullYear()+"."+(x.getMonth()+1)+"."+x.getDate(); };
var mmss = function(s){ if(!s) return ""; var h=Math.floor(s/3600), m=Math.floor(s%3600/60); return h? h+"시간 "+m+"분" : m+"분"; };

var state = { session:null, access:{}, part:{}, videos:[], files:[], lib:[], course:null, coll:null, videoId:null, hls:null };
// part[상품] = 무료 열람권으로 열린 영상 id 목록 (09-18). 없으면 상품 전체를 볼 수 있다
// 10-31: 4T 세일즈·회원관리·운동지도 페이지에도 짝 교재를 보여 준다(올패스·4T 트레이너 시스템 구매자)
var EBOOK_OF = { "vod-4t-sales":["ebook/rereg.pdf","ebook/ot.pdf","ebook/referral.pdf","ebook/consult.pdf","ebook/inbody.pdf"],
  "vod-4t-member":["ebook/personal.pdf","ebook/diet.pdf","ebook/schedule.pdf","ebook/online.pdf"],
  "vod-4t-coach":["ebook/static.pdf","ebook/dynamic.pdf","ebook/custom.pdf","ebook/smalltalk.pdf","ebook/teaching.pdf","ebook/2on1.pdf"] };
var ASK = '<p class="muted" style="margin-top:18px">질문·문의: <a href="mailto:gjwodbs77@gmail.com">gjwodbs77@gmail.com</a> — 결제할 때 쓴 이메일로 보내 주세요.</p>';
function canPlay(v){ var p = state.part[v.product_id]; return !p || p.indexOf(v.id) >= 0; }

async function authed(url, body){
  var s = await HB.session();
  var r = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json", apikey:HB.SB_KEY, Authorization:"Bearer "+(s? s.access_token : HB.SB_KEY) }, body: JSON.stringify(body) });
  return r;
}

async function boot(){
  state.session = await HB.session();
  if (!state.session) {
    document.getElementById("lead").textContent = "결제할 때 쓴 계정(이메일)으로 로그인하면 구매한 강의가 보입니다.";
    HB.mountAuth($app, function(){ boot(); });
    return;
  }
  document.getElementById("lead").textContent = "구매한 강의를 12개월 동안 볼 수 있습니다.";
  var r1 = await sb.rpc("vod_my_access");
  state.access = {}; state.part = {};
  (r1.data||[]).forEach(function(a){ state.access[a.product_id] = a.expires_at; if (a.videos) state.part[a.product_id] = a.videos; });
  var r2 = await sb.from("vod_videos").select("*").eq("free", false).order("sort");
  state.videos = r2.data || [];
  var r3 = await sb.from("vod_files").select("*").order("sort");
  state.files = r3.data || [];
  // 10-31 내 자료실 — 무료로 받은 문서형 자료(릴스 미끼). 표가 없거나 못 읽으면 빈 목록
  var r4 = await sb.from("free_doc_access").select("offer_id, created_at, free_offers(title, what)").order("created_at", { ascending:false });
  state.lib = r4.error ? [] : (r4.data || []);
  var qs = new URLSearchParams(location.search), q = qs.get("c");
  if (q && state.access[q]) openCourse(q, qs.get("t")); else if (qs.get("v") === "lib") library(); else home();
}

function whoBar(){
  var u = state.session.user;
  return '<div class="who"><span class="me">'+esc((u.user_metadata&&u.user_metadata.name)||"")+' '+esc(u.email)+'</span><a href="#" id="logout">로그아웃</a></div>';
}
function bindWho(){ var a=document.getElementById("logout"); if(a) a.onclick=async function(e){ e.preventDefault(); await sb.auth.signOut(); location.href=location.pathname; }; }

function home(){
  stopPlayer(); state.course=null;
  history.replaceState(null, "", location.pathname);
  var mine = COURSES.filter(function(c){ return state.access[c.id]; });
  var rest = COURSES.filter(function(c){ return !state.access[c.id]; });
  var h = whoBar() + mainTabs("home");
  h += '<h2 class="sec">내 강의 ' + mine.length + '</h2>';
  if (!mine.length) h += '<p class="muted">아직 구매한 강의가 없습니다. 아래에서 고르거나 <a href="../#/vod">무료 강의</a>부터 보세요.</p>';
  else h += '<div class="grid">' + mine.map(function(c){
    var pt = state.part[c.id];
    return '<button class="course" data-c="'+c.id+'">'+kTag(c)+'<span class="t">'+esc(c.name)+'</span><span class="d">'+esc(c.desc)+'</span><span class="s">'+(pt ? '무료 열람 '+pt.length+'편 · ' : '')+ymd(state.access[c.id])+'까지 볼 수 있음</span></button>';
  }).join("") + '</div>';
  // 10-30: 올패스·트레이너 시스템에만 딸린 자료(교재 15권 · 시청 순서 안내)는 강의 카드가 없어 안 보이던 것 → 첫 화면에 따로 보여 준다
  var bfiles = state.files.filter(function(f){ return (f.product_id==="vod-allpass"||f.product_id==="vod-4t-master") && state.access[f.product_id]; });
  if (bfiles.length) h += '<h2 class="sec">자료 내려받기 · 교재와 안내</h2><p class="muted" style="margin:-6px 0 8px">PDF는 구매하신 이메일이 쪽마다 찍혀서 내려받아집니다. 엑셀은 컴퓨터에서 여세요. 자료는 구매한 센터 안에서만 쓰세요.</p><div class="files">'+bfiles.map(function(f){ return '<button data-f="'+esc(f.key)+'">'+esc(f.title)+(/[.]xlsx$/.test(f.key)?' 엑셀':' PDF')+'</button>'; }).join("")+'</div>';
  if (rest.length) {
    h += '<h2 class="sec">더 볼 수 있는 강의</h2><div class="grid">';
    h += BUNDLES.filter(function(b){ return !state.access[b.id]; }).map(function(b){
      return '<div class="course locked" style="border-color:rgba(147,147,147,.45)">'+kTag(b)+'<span class="t">'+esc(b.name)+'</span><span class="d">'+esc(b.desc)+'</span><span class="s">'+won(b.price)+'</span><a class="buy" href="../pay/?p='+b.id+'">구매하기 →</a></div>';
    }).join("");
    h += rest.map(function(c){
      return '<div class="course locked">'+kTag(c)+'<span class="t">'+esc(c.name)+'</span><span class="d">'+esc(c.desc)+'</span><span class="s">'+won(c.price)+' · 12개월</span><a class="buy" href="../pay/?p='+c.id+'">구매하기 →</a></div>';
    }).join("") + '</div>';
  }
  h += ASK;
  $app.innerHTML = h; bindWho(); bindTabs();
  $app.querySelectorAll("[data-c]").forEach(function(b){ b.onclick = function(){ openCourse(b.getAttribute("data-c")); }; });
  $app.querySelectorAll("[data-f]").forEach(function(b){ b.onclick=function(){ download(b.getAttribute("data-f"), b); }; });
}

// 10-31 강의실 안 탭: 「내 강의」 · 「내 자료실」
function mainTabs(on){
  return '<div class="tabs" id="mainTabs" role="tablist"><button type="button" role="tab" data-v="home" aria-selected="'+(on==="home")+'" class="'+(on==="home"?"on":"")+'">내 강의</button>'+
    '<button type="button" role="tab" data-v="lib" aria-selected="'+(on==="lib")+'" class="'+(on==="lib"?"on":"")+'">내 자료실 '+state.lib.length+'</button></div>';
}
function bindTabs(){
  var t=document.getElementById("mainTabs"); if(!t) return;
  t.querySelectorAll("button").forEach(function(b){ b.onclick=function(){ if (b.getAttribute("data-v")==="lib") library(); else home(); }; });
}
function library(){
  stopPlayer(); state.course=null;
  history.replaceState(null, "", location.pathname + "?v=lib");
  var h = whoBar() + mainTabs("lib");
  h += '<h2 class="sec">내 자료실 ' + state.lib.length + '</h2>';
  if (!state.lib.length) h += '<p class="muted">아직 받은 무료 자료가 없습니다. 릴스에 나온 자료를 받으면 여기에 자동으로 모입니다.</p>';
  else h += '<p class="muted" style="margin:-6px 0 8px">받은 자료는 기간 없이 언제든 다시 열 수 있습니다. 화면에서 바로 적고 인쇄해도 됩니다.</p><div class="grid">' + state.lib.map(function(a){
    var o = a.free_offers || {};
    return '<a class="course" style="text-decoration:none" href="/free/'+encodeURIComponent(a.offer_id)+'/view/"><span class="t">'+esc(o.title||a.offer_id)+'</span><span class="d">'+esc(o.what||"")+'</span><span class="s">'+ymd(a.created_at)+' 받음 · 열기 →</span></a>';
  }).join("") + '</div>';
  h += ASK;
  $app.innerHTML = h; bindWho(); bindTabs();
}

// want: 영상 제목 — 자가진단의 「이미 구매했다면 바로 보기」가 넘겨준다. 그 영상이 든 묶음을 열고 바로 띄운다
function openCourse(id, want){
  var c = COURSES.filter(function(x){ return x.id===id; })[0]; if(!c) return home();
  state.course = id;
  history.replaceState(null, "", location.pathname + "?c=" + id);
  var vids = state.videos.filter(function(v){ return v.product_id===id; });
  var colls = []; vids.forEach(function(v){ if (colls.indexOf(v.collection)<0) colls.push(v.collection); });
  var files = state.part[id] ? [] : state.files.filter(function(f){ return f.product_id===id; });   // 무료 열람권은 문제지 제외
  if (!state.part[id] && EBOOK_OF[id] && state.access["vod-4t-master"]) files = files.concat(state.files.filter(function(f){ return EBOOK_OF[id].indexOf(f.key)>=0; }));
  var wv = want ? vids.filter(function(v){ return v.title === want; })[0] : null;
  state.coll = wv ? wv.collection : colls[0];
  var h = whoBar() + '<a href="#" class="back" id="toHome">← 내 강의</a>';
  h += '<div class="player" id="player"><video id="vid" controls playsinline controlslist="nodownload nofullscreen" disablepictureinpicture></video><span class="mark" id="mark"></span><button class="fs" id="fs" type="button">전체화면</button><button class="pstart" id="pstart" type="button" hidden><i aria-hidden="true"></i><span>재생</span></button></div>';
  h += '<p class="ptitle" id="ptitle">'+esc(c.name)+'</p><p class="muted" id="pmsg">목록에서 영상을 고르세요 · '+ymd(state.access[id])+'까지</p>';
  if (colls.length>1) h += '<div class="tabs" id="tabs">'+colls.map(function(n,i){ return '<button data-k="'+esc(n)+'" class="'+(n===state.coll?'on':'')+'">'+esc(label(n))+'</button>'; }).join("")+'</div>';
  else h += '<div style="height:18px"></div>';
  h += '<div class="list" id="list"></div>';
  if (state.part[id]) h += '<p class="muted" style="margin-top:12px">무료 열람권으로 '+state.part[id].length+'편이 열려 있습니다. 나머지는 <a href="../pay/?p='+id+'">강의를 구매</a>하면 12개월 동안 볼 수 있습니다.</p>';
  if (files.length) h += '<h2 class="sec">자료 내려받기</h2><p class="muted" style="margin:-6px 0 8px">PDF는 구매하신 이메일이 쪽마다 찍혀서 내려받아집니다. 엑셀은 컴퓨터에서 여세요. 자료는 구매한 센터 안에서만 쓰세요.</p><div class="files">'+files.map(function(f){ return '<button data-f="'+esc(f.key)+'">'+esc(f.title)+(/[.]xlsx$/.test(f.key)?' 엑셀':' PDF')+'</button>'; }).join("")+'</div>';
  if (!vids.length) h += '<p class="muted" style="margin-top:14px">영상을 준비하고 있습니다.</p>';
  h += ASK;
  $app.innerHTML = h; bindWho();
  document.getElementById("toHome").onclick = function(e){ e.preventDefault(); home(); };
  document.getElementById("fs").onclick = function(){ var p=document.getElementById("player"); if (document.fullscreenElement) document.exitFullscreen(); else if (p.requestFullscreen) p.requestFullscreen(); else document.getElementById("vid").webkitEnterFullscreen && document.getElementById("vid").webkitEnterFullscreen(); };
  var tabs = document.getElementById("tabs");
  if (tabs) tabs.querySelectorAll("button").forEach(function(b){ b.onclick=function(){ tabs.querySelectorAll("button").forEach(function(x){x.classList.remove("on");}); b.classList.add("on"); state.coll=b.getAttribute("data-k"); drawList(); }; });
  $app.querySelectorAll("[data-f]").forEach(function(b){ b.onclick=function(){ download(b.getAttribute("data-f"), b); }; });
  drawList();
  if (!wv && state.part[id]) { wv = vids.filter(canPlay)[0] || null; if (wv) { state.coll = wv.collection; if (tabs) tabs.querySelectorAll("button").forEach(function(x){ x.classList.toggle("on", x.getAttribute("data-k")===state.coll); }); drawList(); } }
  var first = wv || vids.filter(function(v){ return v.collection===state.coll; })[0];
  if (first) ready(first);
}
/* 11-13 강의를 열기만 해서는 재생 주소를 받지 않는다 — vod-play 가 부를 때마다 재생으로 기록하고, 환불 계산이 그 기록을 본다.
   재생 단추(또는 목록)를 눌렀을 때만 부른다 */
function ready(v){
  stopPlayer(); state.videoId = v.id; drawList();
  document.getElementById("ptitle").textContent = v.title;
  var b = document.getElementById("pstart"); b.hidden = false; b.onclick = function(){ play(v.id, true); };
}
function label(n){
  if (/나눠 보기/.test(n)) return "연차별로 나눠 보기";
  if (/트레이너 가이드/.test(n)) return "전체 강의";
  if (/레벨별/.test(n)) return "레벨별 해설";
  if (/영역별/.test(n)) return "영역별 해설";
  return n;
}
function drawList(){
  var vids = state.videos.filter(function(v){ return v.product_id===state.course && v.collection===state.coll; });
  document.getElementById("list").innerHTML = vids.map(function(v,i){
    var ok = canPlay(v);
    return '<button data-v="'+v.id+'" class="'+(v.id===state.videoId?'on':'')+'"'+(ok?'':' disabled style="opacity:.45;cursor:default"')+'><span class="n">'+(i+1)+'</span><span style="flex:1">'+esc(v.title)+'</span><span class="len">'+(ok?mmss(v.length_sec):'구매 후')+'</span></button>';
  }).join("");
  document.querySelectorAll("#list [data-v]").forEach(function(b){ b.onclick=function(){ play(b.getAttribute("data-v"), true); }; });
}

var markTimer = null;
function stopPlayer(){ if (state.hls) { state.hls.destroy(); state.hls=null; } clearInterval(markTimer); }
async function play(videoId, auto){
  stopPlayer(); state.videoId = videoId; drawList();
  var msg = document.getElementById("pmsg"), video = document.getElementById("vid");
  msg.textContent = "영상 준비 중…";
  var ps = document.getElementById("pstart"); if (ps) ps.hidden = true;
  var r = await authed(FN + "vod-play", { videoId: videoId });
  var d = await r.json().catch(function(){ return {}; });
  if (!d.ok) { msg.textContent = d.message || "재생할 수 없습니다"; return; }
  document.getElementById("ptitle").textContent = d.title;
  msg.textContent = "";
  var mark = document.getElementById("mark"); mark.textContent = d.mark;
  var move = function(){ mark.style.left = (4 + Math.random()*58) + "%"; mark.style.top = (6 + Math.random()*80) + "%"; };
  move(); markTimer = setInterval(move, 15000);
  var key = "hb-pos-" + videoId;
  video.onloadedmetadata = function(){
    try { var p = +localStorage.getItem(key); if (p > 5 && p < video.duration - 10) video.currentTime = p; } catch(e){}
    var ar = video.videoWidth && video.videoHeight ? video.videoWidth / video.videoHeight : 16/9;
    document.getElementById("player").style.aspectRatio = ar < 1 ? "4/5" : (video.videoWidth + "/" + video.videoHeight);
    if (auto) video.play().catch(function(){});
  };
  video.ontimeupdate = function(){ try { localStorage.setItem(key, Math.floor(video.currentTime)); } catch(e){} };
  if (video.canPlayType("application/vnd.apple.mpegurl")) { video.src = d.hls; }
  else if (window.Hls && Hls.isSupported()) { state.hls = new Hls({ maxBufferLength: 30 }); state.hls.loadSource(d.hls); state.hls.attachMedia(video);
    state.hls.on(Hls.Events.ERROR, function(_, e){ if (e.fatal) msg.textContent = "재생 중 문제가 생겼습니다. 새로고침해 주세요. (" + e.details + ")"; }); }
  else msg.textContent = "이 브라우저는 재생을 지원하지 않습니다. 크롬이나 사파리로 열어 주세요.";
}

async function download(key, btn){
  var t = btn.textContent; btn.disabled = true; btn.textContent = "만드는 중…";
  try {
    var r = await authed(FN + "vod-file", { key: key });
    if (!r.ok) { var e = await r.json().catch(function(){ return {}; }); throw new Error(e.message || "내려받지 못했습니다"); }
    var blob = await r.blob(); var cd = r.headers.get("Content-Disposition") || "";
    var m = cd.match(/filename\*=UTF-8''([^;]+)/); var name = m ? decodeURIComponent(m[1]) : "문제지.pdf";
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  } catch (e) { alert(e.message); }
  btn.disabled = false; btn.textContent = t;
}

sb.auth.onAuthStateChange(function(ev){ if (ev === "SIGNED_OUT") location.href = location.pathname; });
boot();
})();
</script>
