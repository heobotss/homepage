<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex">
<title>선생님 회원으로 바로 세는 1분 계산표 — 허봇스 자료실</title>
<meta name="description" content="결제 내역만 열면 됩니다. 회원이 몇 번째 결제에서 빠지는지 1분 만에 세어 보고, 우리 센터에서 회원이 새는 회차를 찾습니다.">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/* 허봇스 미끼 자료실 (2026-10-31) — 문서형 열람권을 받은 사람만 본문이 보이는 페이지 /free/<id>/view/
   _무료열림굽기.py 가 kind=doc 열람권마다 이 틀로 굽는다. 본문은 서버(free_docs)에서 받은 사람에게만 내려온다.
   바깥은 신청 페이지와 같은 검정, 자료는 종이처럼 밝은 칸 — 화면에서 바로 적고 그대로 인쇄한다. */
@font-face{font-family:'Pretend';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/pretendard-400.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/pretendard-700.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-style:normal;font-weight:900;font-display:swap;src:url('/fonts/pretendard-900.woff2') format('woff2')}
@font-face{font-family:'Bahn';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/bahn-700.woff2') format('woff2')}
:root{
  color-scheme:dark;
  --ink:#0A0A0A; --ink-2:#111111; --bone:#F2F2F2; --bone-2:#BDBDBD; --warm:#8E8E8E;
  --line:#222222; --line-2:#2F2F2F; --blue:#4F86F7; --bad:#E07A6B;
  --paper:#F7F6F3; --pink:#161616; --pline:#D9D6D0; --pmute:#6B6862; --mark:#FFF3B0;
  --sans:"Pretend","Pretendard","Apple SD Gothic Neo",-apple-system,system-ui,sans-serif;
  --tech:"Bahn","Bahnschrift",var(--sans);
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans);font-size:1rem;line-height:1.8;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:var(--bone)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:1.25rem;letter-spacing:-.02em;color:var(--bone);text-decoration:none}
.logo small{font-family:var(--tech);font-size:.6875rem;color:var(--blue);letter-spacing:.12em;margin-left:6px;vertical-align:2px}
.top nav{display:flex;gap:16px;font-size:.8125rem}
.top nav a{color:var(--warm);text-decoration:none}
.top nav a:hover{color:var(--bone)}
main{width:100%;max-width:820px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.eyebrow{font-family:var(--tech);font-size:.75rem;letter-spacing:.14em;color:var(--blue);margin:0 0 10px}
h1.t{font-size:clamp(1.7rem,5.5vw,2.5rem);line-height:1.25;letter-spacing:-.04em;font-weight:900;margin:0;text-wrap:balance}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:11px 18px;min-height:44px;font-size:.9375rem;font-weight:700;cursor:pointer;background:#F2F2F2;color:#0A0A0A;text-decoration:none}
.btn:hover{background:#FFF}
.btn.line{background:transparent;color:var(--bone);border:1px solid var(--line-2)}
.muted{color:var(--warm);font-size:.9375rem}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line-2);border-top-color:var(--bone-2);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* 종이 */
.paper{background:var(--paper);color:var(--pink);border-radius:14px;padding:clamp(20px,5vw,44px);color-scheme:light}
.paper h1{font-size:1.5rem;line-height:1.35;letter-spacing:-.03em;margin:0 0 14px}
.paper h2{font-size:1.15rem;letter-spacing:-.02em;margin:32px 0 10px;padding-top:18px;border-top:1px solid var(--pline)}
.paper h2:first-child{margin-top:0;padding-top:0;border-top:0}
.paper p{margin:10px 0}
.paper strong{background:linear-gradient(transparent 60%,var(--mark) 60%);font-weight:700}
.paper ul,.paper ol{margin:10px 0;padding-left:1.3em}
.paper li{margin:6px 0}
.paper blockquote{margin:12px 0;padding:12px 16px;border-left:3px solid var(--pline);background:#EFEDE8;border-radius:0 8px 8px 0}
.paper blockquote p{margin:4px 0}
.tbl{overflow-x:auto;margin:12px 0;-webkit-overflow-scrolling:touch}
.paper table{border-collapse:collapse;width:100%;min-width:480px;font-size:.9375rem;background:#fff}
.paper th,.paper td{border:1px solid var(--pline);padding:9px 10px;text-align:left;vertical-align:top}
.paper th{background:#EFEDE8;font-weight:700;white-space:nowrap}
.paper td input{width:100%;min-width:56px;border:0;border-bottom:1.5px dashed #B9B5AD;background:transparent;font:inherit;color:inherit;padding:2px 0;outline:none}
.paper td input:focus{border-bottom-color:var(--blue)}
.paper .unit{display:flex;align-items:center;gap:4px}
.paper .chk{list-style:none;padding-left:0}
.paper .chk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.paper .chk input{width:18px;height:18px;margin-top:4px;flex:none;accent-color:#161616}
.paper .copybox{position:relative;margin:12px 0}
.paper pre{white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--pline);border-radius:10px;padding:16px;font:500 .875rem/1.75 ui-monospace,"Cascadia Mono",Consolas,var(--sans);margin:0}
.paper .copy{margin-top:10px}
.gate{margin-top:8px;padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--ink-2)}
.gate h2{margin:0 0 6px;font-size:1.15rem}
.gate .auth{margin-top:14px}
.gate .auth label{display:block;font-size:.9375rem;color:var(--bone-2);margin:12px 0 6px}
.gate .auth input{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;color:var(--bone);font:inherit;padding:12px 14px;outline:none}
.gate .auth .btn{display:flex;width:100%;margin-top:14px}
.gate .auth .note{font-size:.8125rem;color:var(--warm);line-height:1.7}
.gate .auth .msg{color:var(--bad);font-size:.875rem}
.legal{margin-top:56px;font-size:.8125rem;color:var(--warm);line-height:1.7;border-top:1px solid var(--line);padding:16px 0 0}
.legal a{color:var(--warm)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#F2F2F2;color:#0A0A0A;border-radius:999px;padding:10px 18px;font-weight:700;font-size:.9375rem}

@media print{
  @page{margin:14mm}
  body{background:#fff;color:#000}
  .top,.tools,.legal,.gate,.toast,.noprint{display:none!important}
  main{padding:0;max-width:none}
  .eyebrow{color:#555}
  .paper{background:#fff;padding:0;border-radius:0}
  .paper table{min-width:0}
  .tbl{overflow:visible}
  .paper strong{background:none;text-decoration:underline}
  .paper td input{border-bottom:1px solid #999}
  .paper h2{break-after:avoid}
  .paper tr,.paper pre{break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="/">허봇스<small>HEOBOTSS</small></a>
  <nav><a href="/vod/?v=lib">내 자료실</a><a href="/">홈</a></nav>
</header>
<main>
  <p class="eyebrow">무료 자료</p>
  <h1 class="t">선생님 회원으로 바로 세는 1분 계산표</h1>
  <div class="tools" id="tools" hidden>
    <button class="btn" type="button" id="print">인쇄 · PDF로 저장</button>
    <button class="btn line" type="button" id="copyAll" hidden>지시문 복사</button>
    <a class="btn line" href="/vod/?v=lib">내 자료실</a>
  </div>
  <p class="muted" id="wait"><span class="spin"></span>자료를 여는 중</p>
  <article class="paper" id="doc" hidden></article>
  <section class="gate" id="gate" hidden>
    <h2>자료를 받은 계정으로 로그인해 주세요</h2>
    <p class="muted">메일로 받은 「지금 열기」 버튼을 누르면 로그인된 채로 열립니다. 다른 기기라면 같은 메일로 로그인하세요. 아직 안 받으셨다면 <a href="/free/cycle/">신청 페이지</a>에서 메일 주소만 넣으면 됩니다.</p>
    <div id="auth"></div>
  </section>
  <footer class="legal" id="legal"></footer>
</main>
<script src="/t.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/vod/auth.js"></script>
<script>
(function () {
  "use strict";
  var ID = "cycle";
  var $ = function (s) { return document.querySelector(s); };
  var copyText = "";
  function toast(t) {
    var d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status"); d.textContent = t;
    document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2200);
  }
  async function copy(t) {
    try { await navigator.clipboard.writeText(t); toast("복사했습니다"); }
    catch (e) {
      var ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("복사했습니다"); } catch (x) { toast("길게 눌러 직접 복사해 주세요"); } ta.remove();
    }
  }
  async function boot() {
    if (!window.HB) { $("#wait").textContent = "잠시 문제가 생겼습니다. 새로고침해 주세요."; return; }
    var s = await window.HB.session();
    if (!s) {
      $("#wait").hidden = true; $("#gate").hidden = false;
      window.HB.mountAuth($("#auth"), function () { location.reload(); }, { lead: "수업일지·강의실과 같은 계정입니다." });
      return;
    }
    var r = await window.HB.sb.from("free_docs").select("body_html, copy_text").eq("offer_id", ID).maybeSingle();
    if (r.error || !r.data) { location.replace("/free/" + ID + "/"); return; }   // 받지 않은 계정 → 신청 페이지(로그인돼 있으면 거기서 「바로 열기」)
    $("#doc").innerHTML = r.data.body_html;
    copyText = r.data.copy_text || "";
    $("#copyAll").hidden = !copyText;
    $("#doc").querySelectorAll("[data-copy]").forEach(function (b) {
      b.addEventListener("click", function () { var pre = b.closest(".copybox").querySelector("pre"); copy(pre ? pre.textContent : copyText); });
    });
    $("#wait").hidden = true; $("#doc").hidden = false; $("#tools").hidden = false;
    if (window.HBT) HBT.event("view", "free-doc:" + ID);
  }
  $("#print").addEventListener("click", function () { window.print(); });
  $("#copyAll").addEventListener("click", function () { if (copyText) copy(copyText); });
  fetch("/policy/legal.txt").then(function (r) { return r.ok ? r.text() : ""; }).then(function (t) { if (t) $("#legal").innerHTML = t.replace(/\.\.\/policy\//g, "/policy/"); }).catch(function () {});
  boot();
})();
</script>
</body>
</html>
