@font-face{font-family:'Pretend';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/pretendard-400.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/pretendard-700.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-style:normal;font-weight:900;font-display:swap;src:url('/fonts/pretendard-900.woff2') format('woff2')}
@font-face{font-family:'Bahn';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/bahn-700.woff2') format('woff2')}
:root{
  color-scheme:dark;
  --ink:#0A0A0A; --ink-2:#111111; --bone:#F2F2F2; --bone-2:#BDBDBD; --warm:#8E8E8E;
  --line:#222222; --line-2:#2F2F2F; --blue:#5B8FFA; --bad:#E07A6B;
  --paper:#F7F6F3; --pink:#161616; --pline:#D9D6D0; --pmute:#6B6862; --mark:#FFF3B0;
  --sans:"Pretend","Pretendard","Apple SD Gothic Neo",-apple-system,system-ui,sans-serif;
  --tech:"Bahn","Bahnschrift",var(--sans);
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans);font-size:1rem;line-height:1.8;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:var(--bone)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:1.25rem;letter-spacing:-.02em;color:var(--bone);text-decoration:none}
.logo small{font-family:var(--tech);font-size:.6875rem;color:var(--blue);letter-spacing:.12em;margin-left:6px;vertical-align:2px}
.top nav{display:flex;gap:16px;font-size:.8125rem}
.top nav a{color:var(--warm);text-decoration:none}
.top nav a:hover{color:var(--bone)}
main{width:100%;max-width:820px;margin:0 auto;padding:40px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
.eyebrow{font-family:var(--tech);font-size:.75rem;letter-spacing:.14em;color:var(--blue);margin:0 0 10px}
h1.t{font-size:clamp(1.7rem,5.5vw,2.5rem);line-height:1.25;letter-spacing:-.04em;font-weight:900;margin:0;text-wrap:balance}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:11px 18px;min-height:44px;font-size:.9375rem;font-weight:700;cursor:pointer;background:#F2F2F2;color:#0A0A0A;text-decoration:none}
.btn:hover{background:#FFF}
.btn.line{background:transparent;color:var(--bone);border:1px solid var(--line-2)}
.muted{color:var(--warm);font-size:.9375rem}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line-2);border-top-color:var(--bone-2);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* 종이 */
.paper{background:var(--paper);color:var(--pink);border-radius:14px;padding:clamp(20px,5vw,44px);color-scheme:light}
.paper h1{font-size:1.5rem;line-height:1.35;letter-spacing:-.03em;margin:0 0 14px}
.paper h2{font-size:1.15rem;letter-spacing:-.02em;margin:32px 0 10px;padding-top:18px;border-top:1px solid var(--pline)}
.paper h2:first-child{margin-top:0;padding-top:0;border-top:0}
.paper p{margin:10px 0}
.paper strong{background:linear-gradient(transparent 60%,var(--mark) 60%);font-weight:700}
.paper ul,.paper ol{margin:10px 0;padding-left:1.3em}
.paper li{margin:6px 0}
.paper blockquote{margin:12px 0;padding:12px 16px;border-left:3px solid var(--pline);background:#EFEDE8;border-radius:0 8px 8px 0}
.paper blockquote p{margin:4px 0}
.tbl{overflow-x:auto;margin:12px 0;-webkit-overflow-scrolling:touch}
.paper table{border-collapse:collapse;width:100%;min-width:480px;font-size:.9375rem;background:#fff}
.paper th,.paper td{border:1px solid var(--pline);padding:9px 10px;text-align:left;vertical-align:top}
.paper th{background:#EFEDE8;font-weight:700;white-space:nowrap}
.paper td input{width:100%;min-width:56px;border:0;border-bottom:1.5px dashed #B9B5AD;background:transparent;font:inherit;color:inherit;padding:2px 0;outline:none}
.paper td input:focus{border-bottom-color:var(--blue)}
.paper .unit{display:flex;align-items:center;gap:4px}
.paper .chk{list-style:none;padding-left:0}
.paper .chk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.paper .chk input{width:18px;height:18px;margin-top:4px;flex:none;accent-color:#161616}
.paper .copybox{position:relative;margin:12px 0}
.paper pre{white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--pline);border-radius:10px;padding:16px;font:500 .875rem/1.75 ui-monospace,"Cascadia Mono",Consolas,var(--sans);margin:0}
.paper .copy{margin-top:10px}
.gate{margin-top:8px;padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--ink-2)}
.gate h2{margin:0 0 6px;font-size:1.15rem}
.gate .auth{margin-top:14px}
.gate .auth label{display:block;font-size:.9375rem;color:var(--bone-2);margin:12px 0 6px}
.gate .auth input{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;color:var(--bone);font:inherit;padding:12px 14px;outline:none}
.gate .auth .btn{display:flex;width:100%;margin-top:14px}
.gate .auth .note{font-size:.8125rem;color:var(--warm);line-height:1.7}
.gate .auth .msg{color:var(--bad);font-size:.875rem}
.legal{margin-top:56px;font-size:.8125rem;color:var(--warm);line-height:1.7;border-top:1px solid var(--line);padding:16px 0 0}
.legal a{color:var(--warm)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#F2F2F2;color:#0A0A0A;border-radius:999px;padding:10px 18px;font-weight:700;font-size:.9375rem}

@media print{
  @page{margin:14mm}
  body{background:#fff;color:#000}
  .top,.tools,.legal,.gate,.toast,.noprint{display:none!important}
  main{padding:0;max-width:none}
  .eyebrow{color:#555}
  .paper{background:#fff;padding:0;border-radius:0}
  .paper table{min-width:0}
  .tbl{overflow:visible}
  .paper strong{background:none;text-decoration:underline}
  .paper td input{border-bottom:1px solid #999}
  .paper h2{break-after:avoid}
  .paper tr,.paper pre{break-inside:avoid}
}
/* ── 새 옷 공통 (11-10) ── 옛 화면의 첫 스타일 끝에 덧붙는다. 색 토큰을 새 값으로 다시 선언하고 배경 빛·버튼·판만 바꾼다. 글자·id·스크립트는 그대로 */
:root{color-scheme:dark;--ink:#070D19;--ink-2:#111A2C;--ink-3:#18243C;--bone:#F2F0EB;--bone-2:#C3CBD8;--warm:#9FABBD;--line:#24324A;--line-2:rgba(242,240,235,.16);--blue:#5B8FFA;--brass:#5B8FFA;--bad:#E07A6B}
html{background:#070D19}
body{background:radial-gradient(900px 520px at 50% -120px,rgba(91,143,250,.20),transparent 70%) no-repeat,radial-gradient(600px 400px at 100% 30%,rgba(91,143,250,.07),transparent 70%) no-repeat,var(--ink)}
::selection{background:rgba(91,143,250,.35)}
.btn{border-radius:999px;background:var(--blue);color:#070D19;box-shadow:0 8px 28px rgba(91,143,250,.32),inset 0 1px 0 rgba(255,255,255,.28);transition:background .2s,transform .2s,box-shadow .2s}
.btn:hover{background:#8FB4FF;transform:translateY(-1px)}
.btn[disabled],.btn:disabled{opacity:.38;transform:none;box-shadow:none;cursor:default}
.btn.line,.btn.sub,.btn.soon{background:transparent;color:var(--bone);border:1px solid var(--line-2);box-shadow:none}
.btn.line:hover,.btn.sub:hover{background:rgba(242,240,235,.05);border-color:rgba(242,240,235,.36)}
.card{border:1px solid var(--line-2);border-radius:20px;background:rgba(242,240,235,.03);box-shadow:inset 0 1px 0 rgba(242,240,235,.06),0 24px 64px rgba(0,0,0,.35)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=password],input[type=search],input[type=url],select,textarea{border-radius:14px}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(91,143,250,.16);outline:0}
@media (prefers-reduced-motion:reduce){.btn,.btn:hover{transform:none}}
/* 11-10 체크박스 한 벌 — 새 화면과 같은 꼴(얇은 테두리, 고르면 파랑) */
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:20px;height:20px;flex:0 0 20px;margin-top:2px;border:1.5px solid rgba(242,240,235,.38);border-radius:6px;background:transparent;display:inline-grid;place-content:center;cursor:pointer;transition:background-color .15s,border-color .15s}
input[type=checkbox]::before{content:"";width:10px;height:5px;border-left:2px solid #070D19;border-bottom:2px solid #070D19;transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .15s}
input[type=checkbox]:checked{background:var(--blue);border-color:var(--blue)}
input[type=checkbox]:checked::before{transform:translateY(-1px) rotate(-45deg) scale(1)}
input[type=checkbox]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input[type=checkbox]:disabled{opacity:.4;cursor:default}
/* 무료 자료 상세·열람 — 로그인 상자가 판 안에 또 판으로 겹치지 않게 */
.gate{border:1px solid var(--line-2);border-radius:20px;background:rgba(242,240,235,.03);box-shadow:inset 0 1px 0 rgba(242,240,235,.06),0 24px 64px rgba(0,0,0,.35)}
.gate .card{border:0;border-radius:0;background:none;box-shadow:none;padding:0}
.gate .auth input{border-radius:14px}
/* ══ 11-22 안쪽 디테일(시안 라) ── 첫 화면 묶음(n/common.css 끝 블록)과 같은 손질을 안쪽 화면에: 빛은 왼쪽 위 한 방향 · 카드에 층 · 단추 번짐 없음. 글자·순서·id는 그대로 ══ */
:root{--ink:#070D19;--ink-2:#111A2C;--ink-3:#18243C;--bone:#F2F0EB;--bone-2:#C3CBD8;--warm:#9FABBD;--line:#24324A;--line-2:rgba(242,240,235,.16)}
/* 바탕 빛은 화면 전체(html)에 건다 — 짧은 화면에서 본문 아래가 따로 끊겨 보이지 않게 */
html{min-height:100%;background:radial-gradient(900px 620px at 16% -4%,rgba(91,143,250,.17),transparent 62%),radial-gradient(760px 540px at 100% 100%,rgba(255,86,48,.045),transparent 65%),linear-gradient(180deg,#0A1424 0%,#060B15 100%)!important;background-color:#060B15!important}
body{background:none!important}
/* 카드: 위에서 빛 받는 판, 테두리는 빛 받는 쪽만 밝게. 이름이 같은 단추(a.buy)·글줄(p.what)에 묻지 않게 태그를 붙여 고른다 */
.card,section.gate,div.gate,div.buy,section.member,section.hb-lock,section.taste,#box,div.what,div.make,div.cards:not(:has(.card)){border:1px solid transparent!important;background:linear-gradient(180deg,#18243C 0%,#111A2C 42%) padding-box,linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.05) 38%,rgba(255,255,255,.02) 70%) border-box!important;box-shadow:0 28px 56px -28px rgba(0,0,0,.7)!important}
/* 판 안의 판은 겹치지 않게 */
.gate .card,.card .card,div.buy .card,#box .card,.card .gate{background:none!important;border:0!important;box-shadow:none!important}
/* 결제 화면의 고른 상품 판만 파란 테두리(빛 받는 쪽이 진하게) */
#prodCard.card{background:linear-gradient(180deg,#1B2944 0%,#121C30 46%) padding-box,linear-gradient(135deg,rgba(91,143,250,.8),rgba(91,143,250,.22) 45%,rgba(91,143,250,.08) 75%) border-box!important}
/* 작은 칸은 한 단 조용하게: 면 하나, 윗선만 살짝 */
.learn li,.scene p,.bundle ol{background:#111A2C!important;border-color:#24324A!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
/* 단추: 아래 색 번짐을 빼고 윗면 빛만 */
.btn{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 2px rgba(0,0,0,.4)!important}
.btn:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 2px rgba(0,0,0,.4)!important}
.btn.line,.btn.sub,.btn.soon,.btn[disabled],.btn:disabled{box-shadow:none!important}
.pv .play{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 6px rgba(0,0,0,.5)!important}
/* 판 안의 글 칸은 판보다 한 단 깊게(눌린 칸) */
:is(.card,.gate,#box,div.buy) :is(input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=url],input[type=search],textarea,select){background-color:#0B1322!important;border-color:#2B3A55!important}
/* 아이폰: 글 칸 글자가 16px보다 작으면 누를 때 화면이 저절로 확대된다 → 아이폰에서만 16px 이상으로 */
@supports (-webkit-touch-callout:none){input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):not([type=hidden]),select,textarea{font-size:max(16px,1em)!important}}
/* 로그인 상자 공통: 안내 글이 따로 띠·상자로 보이거나 로그인 단추만 작게 나오던 화면(재등록 도구 등)을 다른 화면과 같게 */
.card.auth .note{border:0!important;background:none!important;padding:0!important;border-radius:0!important}
.card.auth>.btn{display:flex!important;width:100%;justify-content:center;margin-top:14px}
/* 무료 자료 화면에서 열쇠 없이 들어왔을 때 뜨는 로그인 칸: 꾸밈이 빠져 글자가 가장자리에 붙고 칸이 한 줄에 뭉치던 것 */
#lockAuth .card.auth{margin-top:16px;padding:20px!important}
#lockAuth .auth h2{margin:0 0 6px;font-size:1.0625rem}
#lockAuth .auth label{display:block;font-size:.9375rem;margin:12px 0 6px}
#lockAuth .auth input{display:block;width:100%;border:1px solid #2B3A55;border-radius:14px;color:inherit;font:inherit;padding:12px 14px;outline:none}
#lockAuth .auth .note{font-size:.8125rem;line-height:1.7}
/* 카카오 단추 모양을 화면마다 같게(둥근 알약) */
.card.auth #aKk{border-radius:999px!important}
/* ATC 내 과정·관리 화면의 #gate 는 카드가 아니라 자리 잡는 틀이다 — 카드 규칙이 걸려 글자가 테두리에 붙던 것을 되돌린다 */
div#gate.gate{background:none!important;border:0!important;box-shadow:none!important}
/* 강의실 구매 단추: 아래로 번지던 파란 빛 제거(다른 단추와 같게) */
a.buy{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 1px 2px rgba(0,0,0,.4)!important}
/* 파일 고르는 단추가 브라우저 기본 회색으로 나오던 것 */
input[type=file]{color:#C3CBD8;font:inherit;max-width:100%}
input[type=file]::file-selector-button{background:#18243C;color:#F2F0EB;border:1px solid #2B3A55;border-radius:999px;padding:7px 14px;margin-right:10px;font:inherit;font-weight:600;cursor:pointer}
/* 안쪽 디테일 끝 */
</style>
<style id="hb-bar-css">.hb-bar{position:sticky;top:0;z-index:50;height:64px;background:rgba(7,13,25,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #24324A;font-family:"P","Pretend",system-ui,-apple-system,"Malgun Gothic",sans-serif}.hb-bar .hb-in{max-width:1312px;height:100%;margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}.hb-bar a{color:#9FABBD;text-decoration:none}.hb-bar .hb-logo{color:#F2F0EB;font-size:20px;font-weight:800;letter-spacing:-.02em;min-height:44px;display:inline-flex;align-items:center}.hb-bar nav{display:flex;align-items:center;gap:16px;font-size:16px}.hb-bar nav a{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}.hb-bar nav a:hover{color:#F2F0EB}.hb-bar nav a.hb-me{color:#F2F0EB;border:1px solid rgba(242,240,235,.18);border-radius:999px;padding:0 16px}.hb-bar .hb-keep{display:flex;gap:12px;align-items:center;font-size:14px;color:#9FABBD}.hb-bar .hb-keep:empty{display:none}@media (max-width:720px){.hb-bar .hb-in{padding:0 16px}.hb-bar nav{gap:2px;font-size:13px}.hb-bar nav{overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 auto;justify-content:flex-start}.hb-bar nav::-webkit-scrollbar{display:none}.hb-bar .hb-in{gap:8px}.hb-bar nav a{flex:none;min-width:0;padding:0 4px}.hb-bar nav a.hb-me{padding:0 10px;margin-left:2px}.hb-bar .hb-logo{flex:none;white-space:nowrap}.hb-bar .hb-keep{display:none}}@media (max-width:400px){.hb-bar nav{font-size:12px}.hb-bar nav a{padding:0 3px}.hb-bar nav a.hb-me{padding:0 9px}}@media (max-width:359px){.hb-bar nav{mask-image:linear-gradient(90deg,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent)}}</style>

<main>
  <p class="eyebrow">무료 자료</p>
  <h1 class="t">잘한 수업이 숫자로 보이는 수업일지</h1>
  <div class="tools" id="tools" hidden>
    <button class="btn" type="button" id="print">인쇄 · PDF로 저장</button>
    <button class="btn line" type="button" id="copyAll" hidden>지시문 복사</button>
    <a class="btn line" href="/vod/?v=lib">내 자료실</a>
  </div>
  <p class="muted" id="wait"><span class="spin"></span>자료를 여는 중</p>

  <section class="gate" id="gate" hidden>
    <h2>자료를 받은 계정으로 로그인해 주세요</h2>
    <p class="muted">메일로 받은 「지금 열기」 버튼을 누르면 로그인된 채로 열립니다. 다른 기기라면 같은 메일로 로그인하세요. 아직 안 받으셨다면 <a href="/free/journal-num/">신청 페이지</a>에서 메일 주소만 넣으면 됩니다.</p>
    <div id="auth"></div>
  </section>
  <footer class="legal" id="legal"></footer>
</main>
<script src="/t.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="/vod/auth.js"></script>
<script>
(function () {
  "use strict";
  var ID = "journal-num";
  var $ = function (s) { return document.querySelector(s); };
  var copyText = "";
  function toast(t) {
    var d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status"); d.textContent = t;
    document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2200);
  }
  async function copy(t) {
    try { await navigator.clipboard.writeText(t); toast("복사했습니다"); }
    catch (e) {
      var ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("복사했습니다"); } catch (x) { toast("길게 눌러 직접 복사해 주세요"); } ta.remove();
    }
  }
  async function boot() {
    if (!window.HB) { $("#wait").textContent = "잠시 문제가 생겼습니다. 새로고침해 주세요."; return; }
    var s = await window.HB.session();
    if (!s) {
      $("#wait").hidden = true; $("#gate").hidden = false;
      window.HB.mountAuth($("#auth"), function () { location.reload(); }, { lead: "수업일지·강의실과 같은 계정입니다." });
      return;
    }
    var r = await window.HB.sb.from("free_docs").select("body_html, copy_text").eq("offer_id", ID).maybeSingle();
    if (r.error || !r.data) { location.replace("/free/" + ID + "/"); return; }   // 받지 않은 계정 → 신청 페이지(로그인돼 있으면 거기서 「바로 열기」)
    if (/^\s*<!doctype/i.test(r.data.body_html)) {   // 11-18 완성 페이지 자료(릴스 첫 10편) — 계산기·표·디자인 그대로 화면을 통째로 바꾼다
      if (window.HBT) HBT.event("view", "free-doc:" + ID);
      document.open(); document.write(r.data.body_html); document.close();
      return;
    }
    $("#doc").innerHTML = r.data.body_html;
    copyText = r.data.copy_text || "";
    $("#copyAll").hidden = !copyText;
    $("#doc").querySelectorAll("[data-copy]").forEach(function (b) {
      b.addEventListener("click", function () { var pre = b.closest(".copybox").querySelector("pre"); copy(pre ? pre.textContent : copyText); });
    });
    $("#wait").hidden = true; $("#doc").hidden = false; $("#tools").hidden = false;
    if (window.HBT) HBT.event("view", "free-doc:" + ID);
  }
  $("#print").addEventListener("click", function () { window.print(); });
  $("#copyAll").addEventListener("click", function () { if (copyText) copy(copyText); });
  fetch("/policy/legal.txt").then(function (r) { return r.ok ? r.text() : ""; }).then(function (t) { if (t) $("#legal").innerHTML = t.replace(/\.\.\/policy\//g, "/policy/"); }).catch(function () {});
  boot();
})();
</script>
</body>
</html>
