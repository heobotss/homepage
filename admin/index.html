<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>오늘 누가 왔나 — 허봇스</title>
<link rel="icon" href="../favicon.png" type="image/png">
<style>
/* 관리 화면 (2026-10-12) — 대표님만 봅니다.
   창고를 직접 뒤지지 않고 한 화면에서 봅니다. 숫자는 전부 서버의 hb_board() 하나가 줍니다.
   ⚠ 이 화면은 아무것도 고치지 않습니다. 보기만 합니다. 관리자가 아니면 아예 안 열립니다. */
@font-face{font-family:'Pretend';font-style:normal;font-weight:400;font-display:swap;src:url('../fonts/pretendard-400.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-style:normal;font-weight:700;font-display:swap;src:url('../fonts/pretendard-700.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-style:normal;font-weight:900;font-display:swap;src:url('../fonts/pretendard-900.woff2') format('woff2')}
:root{color-scheme:dark;--ink:#0A0A0A;--ink-2:#111111;--ink-3:#171717;--bone:#F2F2F2;--bone-2:#BDBDBD;--warm:#8E8E8E;
  --line:#333333;--line-2:#3C3C3C;--blue:#4F86F7;--good:#5FBF8A;--bad:#E07A6B;--amber:#E0B24E;
  --sans:"Pretend","Pretendard","Apple SD Gothic Neo",-apple-system,system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--bone-2)}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px clamp(16px,4vw,36px);border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:1.125rem;color:var(--bone);text-decoration:none}
.top .r{display:flex;align-items:center;gap:14px;font-size:.875rem;color:var(--warm)}
.top button{background:none;border:1px solid var(--line-2);border-radius:8px;padding:6px 12px;color:var(--bone-2);cursor:pointer;font-size:.875rem}
main{max-width:1000px;margin:0 auto;padding:clamp(24px,5vw,44px) clamp(16px,4vw,28px) 60px}
h1{font-size:clamp(1.5rem,4vw,2rem);letter-spacing:-.03em;margin:0 0 4px}
.sub{color:var(--warm);font-size:.875rem;margin:0 0 26px}

.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:28px}
.num{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.num b{display:block;font-size:1.75rem;font-weight:900;letter-spacing:-.03em;line-height:1.2}
.num span{display:block;font-size:.8125rem;color:var(--warm);margin-top:2px}
.num.hi b{color:var(--blue)}
.num.warn b{color:var(--amber)}

section{margin-top:30px}
section h2{font-size:1rem;margin:0 0 10px;color:var(--bone-2);font-weight:700}
section h2 small{color:var(--warm);font-weight:400;font-size:.8125rem;margin-left:8px}
.box{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:260px}
th{color:var(--warm);font-weight:400;font-size:.8125rem;background:var(--ink-3)}
tr:last-child td{border-bottom:0}
td.dim{color:var(--warm)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.75rem;border:1px solid var(--line-2);color:var(--bone-2)}
.tag.sent{color:var(--good);border-color:#2E4A3C}
.tag.failed{color:var(--bad);border-color:#4A2E2A}
.tag.work{color:var(--amber);border-color:#4A3E24}
.bars{padding:14px 16px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;align-items:center;gap:10px;margin:6px 0;font-size:.875rem}
.bar i{display:block;height:8px;border-radius:999px;background:var(--blue);opacity:.75;min-width:3px}
.bar u{text-decoration:none;color:var(--warm);font-size:.8125rem}
.empty{padding:18px;color:var(--warm);font-size:.9375rem}
.auth{margin-top:26px;padding:22px;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;max-width:460px}
.auth h2{margin:0 0 4px;font-size:1.15rem}
.auth label{display:block;font-size:.9375rem;color:var(--bone-2);margin:14px 0 7px}
.auth input{width:100%;background:var(--ink-3);border:1px solid var(--line-2);border-radius:10px;color:var(--bone);font:inherit;padding:13px 15px;outline:none}
.auth .btn{display:flex;align-items:center;justify-content:center;width:100%;margin-top:18px;border:0;border-radius:12px;padding:14px;background:#F2F2F2;color:#0A0A0A;font-weight:700;cursor:pointer}
.auth .note{font-size:.8125rem;color:var(--warm)}
.auth .msg{color:var(--bad);font-size:.875rem}
@media (max-width:620px){ th.hide,td.hide{display:none} }
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="../">허봇스 <span style="color:var(--warm);font-weight:400;font-size:.875rem">관리</span></a>
  <div class="r"><span id="who"></span><button id="again" hidden>새로 보기</button></div>
</header>

<main>
  <h1>오늘 누가 왔나</h1>
  <p class="sub" id="when">불러오는 중…</p>

  <div id="authBox"></div>
  <div id="deny" class="empty" hidden>이 계정은 관리자가 아닙니다. 대표님 계정으로 로그인해 주세요.</div>

  <div id="board" hidden>
    <div class="nums" id="nums"></div>

    <section>
      <h2>신청 처리 <small>내 이름 리포트 · 센터 진단표</small></h2>
      <div class="box" id="reqBox"></div>
    </section>

    <section>
      <h2>최근 들어온 분 <small>20명</small></h2>
      <div class="box" id="latestBox"></div>
    </section>

    <section>
      <h2>어느 길로 들어왔나 <small>명단 전체</small></h2>
      <div class="box bars" id="viaBox"></div>
    </section>

    <section>
      <h2>어느 콘텐츠가 데려왔나 <small>최근 30일 · 링크에 적힌 표시값</small></h2>
      <div class="box bars" id="funnelBox"></div>
    </section>

    <section>
      <h2>최근 주문 <small>10건</small></h2>
      <div class="box" id="orderBox"></div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../vod/auth.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var sb = window.HB.sb, esc = window.HB.esc;

  function 때(iso, 짧게) {
    if (!iso) return "";
    try {
      return new Date(iso).toLocaleString("ko-KR",
        짧게 ? { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }
             : { year: "numeric", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" });
    } catch (e) { return iso.slice(0, 16).replace("T", " "); }
  }

  function 표(머리, 줄들, 비었을때) {
    if (!줄들 || !줄들.length) return '<p class="empty">' + 비었을때 + "</p>";
    return "<table><tr>" + 머리.map(function (h) {
      return '<th' + (h.hide ? ' class="hide"' : "") + ">" + esc(h.t) + "</th>";
    }).join("") + "</tr>" + 줄들.join("") + "</table>";
  }

  function 막대(목록, 이름칸, 값칸, 비었을때) {
    if (!목록 || !목록.length) return '<p class="empty" style="padding:4px 2px">' + 비었을때 + "</p>";
    var 최대 = Math.max.apply(null, 목록.map(function (v) { return Number(v[값칸]) || 0; })) || 1;
    return 목록.map(function (v) {
      var n = Number(v[값칸]) || 0;
      return '<div class="bar"><span>' + esc(v[이름칸] || "(빈칸)") + "</span>" +
             '<i style="width:' + Math.max(3, Math.round(n / 최대 * 100)) + '%"></i>' +
             "<u>" + n + "</u></div>";
    }).join("");
  }

  function 그리기(d) {
    var s = d.sum || {}, rs = d.reqsum || {};
    $("#when").textContent = 때(d.now) + " 기준";

    $("#nums").innerHTML =
      [["명단 전체", s["명단"], ""], ["오늘 들어온 분", s["오늘"], "hi"], ["이번 주", s["이번주"], ""],
       ["처리 기다림", rs["기다림"], Number(rs["기다림"]) > 0 ? "warn" : ""],
       ["보낸 리포트", rs["보냄"], ""], ["실패", rs["실패"], Number(rs["실패"]) > 0 ? "warn" : ""],
       ["광고 동의", s["광고동의"], ""], ["연락처 있음", s["연락처있음"], ""]]
      .map(function (v) {
        return '<div class="num ' + v[2] + '"><b>' + (v[1] == null ? "–" : v[1]) + "</b><span>" + v[0] + "</span></div>";
      }).join("");

    $("#reqBox").innerHTML = 표(
      [{ t: "언제" }, { t: "갈래" }, { t: "누구" }, { t: "메일", hide: true }, { t: "상태" }, { t: "결과", hide: true }],
      (d.req || []).map(function (v) {
        var 색 = v.status === "sent" ? "sent" : v.status === "failed" ? "failed" : "work";
        var 말 = v.status === "sent" ? "보냄" : v.status === "failed" ? "실패" :
                v.status === "working" ? "굽는 중" : "기다림";
        return "<tr><td class=\"dim\">" + 때(v.created_at, 1) + "</td><td>" +
               (v.kind === "center" ? "센터" : "트레이너") + "</td><td>" + esc(v.name || "-") + "</td>" +
               '<td class="dim hide">' + esc(v.email) + "</td>" +
               '<td><span class="tag ' + 색 + '">' + 말 + "</span></td>" +
               '<td class="dim hide">' + esc(v.summary || v.error || "") + "</td></tr>";
      }), "아직 신청이 없습니다.");

    $("#latestBox").innerHTML = 표(
      [{ t: "언제" }, { t: "메일" }, { t: "이름", hide: true }, { t: "들어온 길" }, { t: "콘텐츠", hide: true }, { t: "광고" }],
      (d.latest || []).map(function (v) {
        return "<tr><td class=\"dim\">" + 때(v.created_at, 1) + "</td><td>" + esc(v.email) + "</td>" +
               '<td class="hide">' + esc(v.name || "") + "</td><td>" + esc(v.via || "-") + "</td>" +
               '<td class="dim hide">' + esc(v.utm_content || "") + "</td>" +
               "<td>" + (v.ad_consent ? "○" : "") + "</td></tr>";
      }), "아직 명단이 비어 있습니다.");

    $("#viaBox").innerHTML    = 막대(d.via, "경로", "수", "아직 없습니다.");
    $("#funnelBox").innerHTML = 막대(d.funnel, "어디서", "수", "최근 30일 기록이 없습니다.");

    $("#orderBox").innerHTML = 표(
      [{ t: "언제" }, { t: "상품" }, { t: "금액" }, { t: "상태" }],
      (d.orders || []).map(function (v) {
        return "<tr><td class=\"dim\">" + 때(v.created_at, 1) + "</td><td>" + esc(v.product_id || "") + "</td>" +
               "<td>" + (v.amount == null ? "" : Number(v.amount).toLocaleString("ko-KR") + "원") + "</td>" +
               "<td>" + esc(v.status || "") + "</td></tr>";
      }), "아직 주문이 없습니다.");

    $("#board").hidden = false;
    $("#again").hidden = false;
  }

  async function 불러오기() {
    var r = await sb.rpc("hb_board");
    if (r.error) {
      $("#when").textContent = "";
      $("#deny").hidden = false;
      return;
    }
    그리기(r.data);
  }

  $("#again").onclick = function () { $("#when").textContent = "불러오는 중…"; 불러오기(); };

  (async function boot() {
    var s = await window.HB.session();
    if (!s) {
      $("#when").textContent = "";
      window.HB.mountAuth($("#authBox"), function () { location.reload(); },
        { lead: "대표님 계정으로 로그인해 주세요." });
      return;
    }
    $("#who").textContent = s.user.email || "";
    $("#authBox").hidden = true;
    불러오기();
  })();
})();
</script>
</body>
</html>
