<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>찾는 페이지가 없습니다 — 허봇스</title>
<meta name="description" content="주소가 바뀌었거나 없는 페이지입니다. 허봇스 홈·레슨·트레이너 점수 체크리스트로 이어 갑니다.">
<link rel="icon" href="/favicon.png" type="image/png">
<style>
/* 없는 주소 화면 — 어느 깊이의 주소에서 떠도 깨지지 않게 경로는 전부 「/」부터 쓴다 (10-21 출시 점검표) */
@font-face{font-family:'Pretend';font-weight:400;font-display:swap;src:url('/fonts/pretendard-400.woff2') format('woff2')}
@font-face{font-family:'Pretend';font-weight:900;font-display:swap;src:url('/fonts/pretendard-900.woff2') format('woff2')}
:root{color-scheme:dark;--ink:#0A0A0A;--ink-2:#111111;--bone:#F2F2F2;--bone-2:#BDBDBD;--warm:#8E8E8E;--blue:#4F86F7;--line:#262626}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--ink);color:var(--bone);
  font-family:'Pretend',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.85;word-break:keep-all}
header{padding:18px clamp(16px,4vw,28px)}
header a{color:var(--bone);text-decoration:none;font-weight:900;font-size:1.25rem;letter-spacing:-.02em}
main{flex:1;width:100%;max-width:620px;margin:0 auto;padding:clamp(48px,12vw,120px) clamp(16px,4vw,28px) 64px}
.code{font-size:.8125rem;letter-spacing:.14em;color:var(--blue);margin:0 0 14px}
h1{font-size:clamp(2rem,7vw,2.8rem);line-height:1.22;letter-spacing:-.045em;font-weight:900;margin:0 0 18px}
p{color:var(--bone-2);margin:0 0 28px;max-width:30em}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li a{display:block;padding:16px 0;border-bottom:1px solid var(--line);color:var(--bone);text-decoration:none}
li a span{display:block;font-size:.875rem;color:var(--warm)}
li a:hover,li a:focus-visible{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
</style>
</head>
<body>
<header><a href="/">허봇스</a></header>
<main>
  <p class="code">404</p>
  <h1>찾는 페이지가<br>없습니다</h1>
  <p>주소가 바뀌었거나 없어진 페이지입니다. 아래에서 이어 가 보세요.</p>
  <ul>
    <li><a href="/">허봇스 홈<span>헬스트레이너를 위한 도구 모음</span></a></li>
    <li><a href="/lesson/">허봇스 레슨<span>회원이 늘어나는 순서 12편</span></a></li>
    <li><a href="/score/">트레이너 점수 체크리스트<span>100문항으로 지금 내 자리 재 보기</span></a></li>
  </ul>
</main>
</body>
</html>
